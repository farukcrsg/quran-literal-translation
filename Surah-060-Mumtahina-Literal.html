      { no: 7, trans: "আশা করা যায়, আল্লাহ তোমাদের এবং যাদের সাথে তোমরা শত্রুতা করছ তাদের মধ্যে বন্ধুত্ব সৃষ্টি করবেন। আর আল্লাহ সর্বশক্তিমান; আর আল্লাহ ক্ষমাশীল, পরম দয়ালু।—", words: [ { ar: "عَسَى", pron: "'আসা", root: "ع س ي", mean: "আশা করা যায়" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "أَن", pron: "আন", root: "ا ن", mean: "যে" }, { ar: "يَجْعَلَ", pron: "ইয়াজ'আলা", root: "ج ع ل", mean: "তৈরি করবেন" }, { ar: "بَيْنَكُمْ", pron: "বাইনাকুম", root: "ب ي ن", mean: "তোমাদের মধ্যে" }, { ar: "وَبَيْنَ", pron: "ওয়া-বাইনা", root: "ب ي ن", mean: "এবং যাদের সাথে" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "عَادَيْتُم", pron: "'আদাইতুম", root: "ع د و", mean: "তোমরা শত্রুতা করেছ" }, { ar: "مِّنْهُم", pron: "মিনহুম", root: "م ن", mean: "তাদের মধ্যে" }, { ar: "مَّوَدَّةً", pron: "মাওয়াদ্দাতান", root: "و د د", mean: "বন্ধুত্ব/স্নেহ" }, { ar: "وَاللَّهُ", pron: "ওয়াল-লাহু", root: "ا ل ه", mean: "আর আল্লাহ" }, { ar: "قَدِيرٌ", pron: "ক্বাদিরুন", root: "ق د ر", mean: "সর্বশক্তিমান" }, { ar: "وَاللَّهُ", pron: "ওয়াল-লাহু", root: "ا ل ه", mean: "আর আল্লাহ" }, { ar: "غَفُورٌ", pron: "গাফুরুন", root: "غ ف ر", mean: "ক্ষমাশীল" }, { ar: "رَّحِيمٌ", pron: "রাহিমুন", root: "ر ح م", mean: "পরম দয়ালু" } ] },
      { no: 8, trans: "যারা তোমাদের সাথে ধর্মের বিষয়ে যুদ্ধ করেনি এবং তোমাদেরকে তোমাদের ঘর থেকে বহিষ্কার করেনি, তাদের সাথে সদ্ব্যবহার ও ন্যায়বিচার করতে আল্লাহ তোমাদের নিষেধ করেন না। নিশ্চয় আল্লাহ ন্যায়পরায়ণদের ভালোবাসেন।—", words: [ { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "يَنْهَاكُمُ", pron: "ইয়ানহাকুমু", root: "ن ه ي", mean: "তোমাদের নিষেধ করেন" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "عَنِ", pron: "'আনি", root: "ع ن", mean: "হতে" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যাদের" }, { ar: "لَمْ", pron: "লাম", root: "ل م", mean: "না" }, { ar: "يُقَاتِلُوكُمْ", pron: "ইউক্বাতিলুকুম", root: "ق ت ل", mean: "তোমাদের সাথে যুদ্ধ করে" }, { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "الدِّينِ", pron: "আদ-দিনি", root: "د ي ن", mean: "ধর্ম/আনুগত্য" }, { ar: "وَلَمْ", pron: "ওয়া-লাম", root: "ل م", mean: "এবং না" }, { ar: "يُخْرِجُوكُم", pron: "ইউখরিজুকুম", root: "خ ر ج", mean: "তোমাদের বহিষ্কার করে" }, { ar: "مِّن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "دِيَارِكُمْ", pron: "দিয়ারিকুম", root: "د و ر", mean: "তোমাদের ঘর" }, { ar: "أَن", pron: "আন", root: "ا ن", mean: "যে" }, { ar: "تَبَرُّوهُمْ", pron: "তাবাররুহুম", root: "ب ر ر", mean: "তাদের সাথে সদ্ব্যবহার করো" }, { ar: "وَتُقْسِطُوا", pron: "ওয়া-তুক্সিতু", root: "ق س ط", mean: "এবং ন্যায়বিচার করো" }, { ar: "إِلَيْهِم", pron: "ইলাইহিম", root: "ا ل ي", mean: "তাদের কাছে" }, { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "اللَّهَ", pron: "আল্লাহা", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "يُحِبُّ", pron: "ইউহিব্বু", root: "ح ب ب", mean: "ভালোবাসেন" }, { ar: "الْمُقْسِطِينَ", pron: "আল-মুক্সিতিনা", root: "ق س ط", mean: "ন্যায়পরায়ণদের" } ] },
      { no: 9, trans: "আল্লাহ তোমাদের শুধু তাদের সাথে বন্ধুত্ব করতে নিষেধ করেন যারা ধর্মের ব্যাপারে তোমাদের সাথে যুদ্ধ করেছে এবং তোমাদেরকে ঘর থেকে বহিষ্কার করেছে এবং তোমাদের বহিষ্কারের পৃষ্ঠপোষকতা করেছে। আর যারা তাদের সাথে বন্ধুত্ব করে তারাই জালিম।—", words: [ { ar: "إِنَّمَا", pron: "ইন্নামা", root: "ا ن", mean: "শুধু" }, { ar: "يَنْهَاكُمُ", pron: "ইয়ানহাকুমু", root: "ن ه ي", mean: "তোমাদের নিষেধ করেন" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "عَنِ", pron: "'আনি", root: "ع ن", mean: "হতে" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যাদের" }, { ar: "قَاتَلُوكُمْ", pron: "ক্বাতালুকুম", root: "ق ت ل", mean: "তোমাদের সাথে যুদ্ধ করেছে" }, { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "الدِّينِ", pron: "আদ-দিনি", root: "د ي ن", mean: "ধর্মে" }, { ar: "وَأَخْرَجُوكُمْ", pron: "ওয়া-আখরাজুকুম", root: "خ ر ج", mean: "এবং তোমাদের বহিষ্কার করেছে" }, { ar: "مِّن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "دِيَارِكُمْ", pron: "দিয়ারিকুম", root: "د و ر", mean: "তোমাদের ঘর" }, { ar: "وَظَاهَرُوا", pron: "ওয়া-যাহারু", root: "ظ ه ر", mean: "এবং সাহায্য/পৃষ্ঠপোষকতা করেছে" }, { ar: "عَلَى", pron: "'আলা", root: "ع ل ي", mean: "উপর" }, { ar: "إِخْرَاجِكُمْ", pron: "ইখরাজিকুম", root: "خ ر ج", mean: "তোমাদের বহিষ্কারের" }, { ar: "وَمَن", pron: "ওয়া-মান", root: "م ن", mean: "আর যে" }, { ar: "يَتَوَلَّهُمْ", pron: "ইয়াতাওয়াল্লাহুম", root: "و ل ي", mean: "তাদের সাথে বন্ধুত্ব করে" }, { ar: "فَأُولَئِكَ", pron: "ফা-উলা-ইকা", root: "ا و ل", mean: "অতএব তারাই" }, { ar: "هُمُ", pron: "হুমু", root: "ه م", mean: "তারা" }, { ar: "الظَّالِمُونَ", pron: "আয-যালিমুনা", root: "ظ ل م", mean: "জালিম/অত্যাচারী" } ] },
      { no: 10, trans: "হে মুমিনগণ! যখন মুমিন নারীরা হিজরত করে তোমাদের কাছে আসে, তখন তাদের পরীক্ষা করো। আল্লাহ তাদের ঈমান সম্পর্কে ভালো জানেন। যদি তোমরা জানতে পারো যে তারা মুমিন, তবে তাদেরকে কাফিরদের কাছে ফিরিয়ে দিয়ো না। তারা কাফিরদের জন্য হালাল নয় এবং কাফিররা তাদের জন্য হালাল নয়। আর তাদেরকে (কাফিরদের) যা ব্যয় করেছে তা ফিরিয়ে দাও। আর যদি তোমরা তাদেরকে (মুসলিম নারীদের) মহর দাও, তবে তোমাদের কোনো গুনাহ নেই। আর কাফির নারীদের বিয়ে রক্ষা করো না এবং যা তোমরা ব্যয় করেছো তা চাও এবং তারাও যা ব্যয় করেছে তা চাইবে। এটাই আল্লাহর বিধান, তিনি তোমাদের মধ্যে বিধান দেন। আর আল্লাহ সর্বজ্ঞ, প্রজ্ঞাময়।—", words: [ { ar: "يَا", pron: "ইয়া", root: "ي ا", mean: "হে" }, { ar: "أَيُّهَا", pron: "আইয়ুহা", root: "ا ي", mean: "যারা" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "آمَنُوا", pron: "আমানু", root: "ا م ن", mean: "ঈমান এনেছে" }, { ar: "إِذَا", pron: "ইযা", root: "ا ذ ا", mean: "যখন" }, { ar: "جَاءَكُم", pron: "জা-আকুম", root: "ج ي ا", mean: "তোমাদের কাছে আসে" }, { ar: "الْمُؤْمِنَاتُ", pron: "আল-মু'মিনাতু", root: "ا م ن", mean: "মুমিন নারীরা" }, { ar: "مُهَاجِرَاتٍ", pron: "মুহাজিরাতিন", root: "ه ج ر", mean: "হিজরতকারী" }, { ar: "فَامْتَحِنُوهُنَّ", pron: "ফাম-তাহিনুহুন্না", root: "م ح ن", mean: "অতএব তাদের পরীক্ষা করো" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "أَعْلَمُ", pron: "আ'লামু", root: "ع ل م", mean: "ভালো জানেন" }, { ar: "بِإِيمَانِهِنَّ", pron: "বি-ইমানিহিন্না", root: "ا م ن", mean: "তাদের ঈমান সম্পর্কে" }, { ar: "فَإِن", pron: "ফা-ইন", root: "ا ن", mean: "অতএব যদি" }, { ar: "عَلِمْتُمُوهُنَّ", pron: "'আলিমতুমুহুন্না", root: "ع ل م", mean: "তোমরা তাদেরকে জানো" }, { ar: "مُؤْمِنَاتٍ", pron: "মু'মিনাতিন", root: "ا م ن", mean: "মুমিন" }, { ar: "فَلَا", pron: "ফা-লা", root: "ل ا", mean: "অতএব না" }, { ar: "تَرْجِعُوهُنَّ", pron: "তারজি'উহুন্না", root: "ر ج ع", mean: "তাদের ফিরিয়ে দিয়ো" }, { ar: "إِلَى", pron: "ইলা", root: "ا ل ي", mean: "দিকে" }, { ar: "الْكُفَّارِ", pron: "আল-কুফফারি", root: "ك ف ر", mean: "কা                             <div className="rounded-[16px] bg-[#fcfffe] border border-dashed border-emerald-200 p-3 md:p-4">

                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>

                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[17px] font-extrabold text-emerald-900">{w.mean}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div className="mt-4">
                              <textarea

                                onChange={(e) => handleNoteChange(idx, e.target.value)}
                              />
                              <div className={`save-indicator ${saved[idx] ? 'show' : ''}`}>
                                ✅ সংরক্ষিত হয়েছে
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* শেষাংশ - সূরার নাম বাংলায় */}

                      <div className="rounded-[14px] bg-gradient-to-r from-emerald-700 to-[#052e16] px-6 py-5 text-center">
                        <p className="text-[21px] md:text-[22px] font-extrabold leading-relaxed text-white tracking-wide">আলহামদুলিল্লাহ – সূরা Mumtahina অনুবাদ সমাপ্ত</p>

                    </div>
                    <div className="mt-8 text-center text-[12px] font-bold tracking-widest text-emerald-800/50 uppercase">@সূরা Mumtahina (060) – ধাতব অর্থ (লিসানুল আরব) • রূট + ধাতব অর্থ • লিসানুল আরব</div>
