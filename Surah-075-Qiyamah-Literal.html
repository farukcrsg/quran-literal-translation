      { no: 3, trans: "কি মানুষ মনে করে যে আমরা তার হাড় জোড়া দেব না?—", words: [ { ar: "أَيَحْسَبُ", pron: "আ-ইয়াহসাবু", root: "ح س ب", mean: "কি সে মনে করে" }, { ar: "الْإِنسَانُ", pron: "আল-ইনসানু", root: "ا ن س", mean: "মানুষ" }, { ar: "أَلَّن", pron: "আ-লান", root: "ا ن", mean: "যে না" }, { ar: "نَّجْمَعَ", pron: "নাজমা'আ", root: "ج م ع", mean: "আমরা জোড়া দেব/সংগ্রহ করব" }, { ar: "عِظَامَهُ", pron: "'ইযামাহু", root: "ع ظ م", mean: "তার হাড়" } ] },

      { no: 6, trans: "সে প্রশ্ন করে, 'কিয়ামতের দিন কখন?'—", words: [ { ar: "يَسْأَلُ", pron: "ইয়াস-আলু", root: "س ا ل", mean: "সে প্রশ্ন করে" }, { ar: "أَيَّانَ", pron: "আইয়ানা", root: "ا ي ن", mean: "কখন" }, { ar: "يَوْمُ", pron: "ইয়াওমু", root: "ي و م", mean: "দিন" }, { ar: "الْقِيَامَةِ", pron: "আল-ক্বিয়ামাতি", root: "ق و م", mean: "প্রতিষ্ঠা/পুনরুত্থান" } ] },

      { no: 11, trans: "কখনো না! কোনো আশ্রয়স্থল নেই—", words: [ { ar: "كَلَّا", pron: "কাল্লা", root: "ك ل ا", mean: "কখনো না" }, { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "وَزَرَ", pron: "ওয়াযারা", root: "و ز ر", mean: "আশ্রয়স্থল" } ] },
      { no: 12, trans: "সেদিন তোমার রবের দিকেই স্থির থাকার জায়গা—", words: [ { ar: "إِلَى", pron: "ইলা", root: "ا ل ي", mean: "দিকে" }, { ar: "رَبِّكَ", pron: "রাব্বিকা", root: "ر ب ب", mean: "তোমার রবের" }, { ar: "يَوْمَئِذٍ", pron: "ইয়াওমা-ইযিন", root: "ي و م", mean: "সেদিন" }, { ar: "الْمُسْتَقَرُّ", pron: "আল-মুসতাকাররু", root: "ق ر ر", mean: "স্থির থাকার জায়গা/প্রত্যাবর্তন" } ] },

      { no: 14, trans: "বরং মানুষ নিজেই নিজের সম্পর্কে সাক্ষী—", words: [ { ar: "بَلِ", pron: "বালি", root: "ب ل", mean: "বরং" }, { ar: "الْإِنسَانُ", pron: "আল-ইনসানু", root: "ا ن س", mean: "মানুষ" }, { ar: "عَلَى", pron: "'আলা", root: "ع ل ي", mean: "উপর" }, { ar: "نَفْسِهِ", pron: "নাফসিহি", root: "ن ف س", mean: "তার নিজের" }, { ar: "بَصِيرَةٌ", pron: "বাসিরাতুন", root: "ب ص ر", mean: "সাক্ষী/দৃষ্টিশক্তি" } ] },

      { no: 16, trans: "তুমি তা দ্রুত আয়ত্ত করার জন্য তোমার জিহ্বা চালিও না—", words: [ { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "تُحَرِّكْ", pron: "তুহাররিক", root: "ح ر ك", mean: "চালিও না/সঞ্চালন করো না" }, { ar: "بِهِ", pron: "বিহি", root: "ب ه", mean: "তা দ্বারা" }, { ar: "لِسَانَكَ", pron: "লিসানাকা", root: "ل س ن", mean: "তোমার জিহ্বা" }, { ar: "لِتَعْجَلَ", pron: "লি-তা'জালা", root: "ع ج ل", mean: "দ্রুত আয়ত্ত করার জন্য" } ] },
      { no: 17, trans: "নিশ্চয় তা সংগ্রহ করা ও পাঠ করা আমাদের দায়িত্ব—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "عَلَيْنَا", pron: "'আলায়না", root: "ع ل ي", mean: "আমাদের উপর" }, { ar: "جَمْعَهُ", pron: "জাম'আহু", root: "ج م ع", mean: "তা সংগ্রহ করা" }, { ar: "وَقُرْآنَهُ", pron: "ওয়া-কুরআনাহু", root: "ق ر ا", mean: "এবং তা পাঠ করা" } ] },

                            <div className="rounded-[16px] bg-gradient-to-br from-emerald-50 to-[#f0fdf4] border border-emerald-100 p-5 md:p-6 mb-5">
                              <p className="text-[21px] md:text-[22px] font-bold leading-[1.8] text-[#14532d] tracking-[-0.01em]">{ayah.trans}</p>
                            </div>
                            <div className="flex items-center gap-2 mb-3">
                              <div className="h-5 w-1 rounded-full bg-emerald-600"></div>
                              <p className="text-[14px] font-extrabold tracking-widest text-emerald-800 uppercase">শব্দার্থ (রূট + ধাতব অর্থ)</p>
                            </div>
                            <div className="rounded-[16px] bg-[#fcfffe] border border-dashed border-emerald-200 p-3 md:p-4">
                              <div className="flex flex-wrap gap-2.5">
                                {ayah.words.map((w, wi) => (
                                  <div key={wi} className="inline-flex items-baseline gap-2 rounded-[14px] bg-[#f0fdf4] border border-emerald-200/70 px-3.5 py-2 shadow-[0_2px_0_#bbf7d0] hover:shadow-[0_4px_12px_-2px_rgba(21,128,61,0.15)] hover:-translate-y-[1px] transition-all">
                                    <span className="amiri text-[22px] font-bold text-emerald-800 leading-none">{w.ar}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[16px] font-semibold text-[#14532d]">{w.pron}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[15px] font-bold text-amber-700">{w.root}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[17px] font-extrabold text-emerald-900">{w.mean}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div className="mt-4">
                              <textarea
                                placeholder="Note:  আয়াত বা শব্দার্থ সম্পর্কে আপনার মন্তব্য লিখুন..."
                                className="w-full h-[80px] resize-none rounded-[14px] border-[2px] border-emerald-500/70 bg-[#f8fef9] px-4 py-3 text-[16px] font-bold leading-relaxed text-[#14532d] placeholder:text-emerald-800/40 placeholder:font-bold focus:outline-none focus:border-emerald-600 focus:ring-[3px] focus:ring-emerald-100 transition-all"
                                value={notes[idx] || ""}
                                onChange={(e) => handleNoteChange(idx, e.target.value)}
                              />
                              <div className={`save-indicator ${saved[idx] ? 'show' : ''}`}>
                                ✅ সংরক্ষিত হয়েছে
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* শেষাংশ - সূরার নাম বাংলায় */}
                    <div className="mt-10 rounded-[16px] bg-gradient-to-r from-emerald-700 via-emerald-600 to-[#052e16] p-[1.5px] shadow-[0_10px_30px_-10px_rgba(21,128,61,0.6)]">
                      <div className="rounded-[14px] bg-gradient-to-r from-emerald-700 to-[#052e16] px-6 py-5 text-center">
                        <p className="text-[21px] md:text-[22px] font-extrabold leading-relaxed text-white tracking-wide">আলহামদুলিল্লাহ – সূরা আল-কিয়ামাহ অনুবাদ সমাপ্ত</p>
                        <div className="mt-2 flex justify-center"><div className="h-1 w-12 rounded-full bg-white/40"></div></div>
                      </div>
                    </div>
                    <div className="mt-8 text-center text-[12px] font-bold tracking-widest text-emerald-800/50 uppercase">@সূরা আল-কিয়ামাহ (075) – ধাতব অর্থ (লিসানুল আরব) • রূট + ধাতব অর্থ • লিসানুল আরব</div>
                  </div>
                </div>
              );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(
              React.createElement(React.StrictMode, null, React.createElement(App))
            );
          </script>
