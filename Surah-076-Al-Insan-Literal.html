          <script type="text/babel">
            const { useState, useEffect } = React;

            const STORAGE_PREFIX = "surah_076_note_";
            const ayahData = [
      { no: 1, trans: "মানুষের উপর কি এমন এক সময় অতিবাহিত হয়নি যখন সে স্মরণযোগ্য কিছু ছিল না?—", words: [ { ar: "هَلْ", pron: "হাল", root: "ه ل", mean: "কি" }, { ar: "أَتَى", pron: "আতা", root: "ا ت ي", mean: "অতিবাহিত/আসে" }, { ar: "عَلَى", pron: "'আলা", root: "ع ل ي", mean: "উপর" }, { ar: "الْإِنسَانِ", pron: "আল-ইনসানি", root: "ا ن س", mean: "মানুষের" }, { ar: "حِينٌ", pron: "হিনুন", root: "ح ي ن", mean: "সময়" }, { ar: "مِّنَ", pron: "মিনা", root: "م ن", mean: "হতে" }, { ar: "الدَّهْرِ", pron: "আদ-দাহরি", root: "د ه ر", mean: "যুগ/কাল" }, { ar: "لَمْ", pron: "লাম", root: "ل م", mean: "না" }, { ar: "يَكُن", pron: "ইয়াকুন", root: "ك و ن", mean: "ছিল" }, { ar: "شَيْئًا", pron: "শাইয়ান", root: "ش ي ا", mean: "কিছু" }, { ar: "مَّذْكُورًا", pron: "মাযকুরান", root: "ذ ك ر", mean: "স্মরণযোগ্য" } ] },
      { no: 2, trans: "নিশ্চয় আমরা মানুষকে মিশ্রিত বীর্য থেকে সৃষ্টি করেছি, আমরা তাকে পরীক্ষা করব; অতঃপর আমরা তাকে শ্রবণশক্তি ও দৃষ্টিশক্তি দিয়েছি—", words: [ { ar: "إِنَّا", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয় আমরা" }, { ar: "خَلَقْنَا", pron: "খালাকনা", root: "خ ل ق", mean: "সৃষ্টি করেছি" }, { ar: "الْإِنسَانَ", pron: "আল-ইনসানা", root: "ا ن س", mean: "মানুষকে" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "نُطْفَةٍ", pron: "নুতফাতিন", root: "ن ط ف", mean: "বীর্য/ফোঁটা" }, { ar: "أَمْشَاجٍ", pron: "আমশাজিন", root: "م ش ج", mean: "মিশ্রিত" }, { ar: "نَّبْتَلِيهِ", pron: "নাবতালিহি", root: "ب ل ي", mean: "আমরা তাকে পরীক্ষা করি" }, { ar: "فَجَعَلْنَاهُ", pron: "ফা-জা'আলনাহু", root: "ج ع ل", mean: "অতঃপর আমরা তাকে তৈরি করেছি" }, { ar: "سَمِيعًا", pron: "সামি'আন", root: "س م ع", mean: "শ্রবণশক্তি" }, { ar: "بَصِيرًا", pron: "বাসিরান", root: "ب ص ر", mean: "দৃষ্টিশক্তি" } ] },
      { no: 3, trans: "নিশ্চয় আমরা তাকে পথ দেখিয়েছি; সে হয় কৃতজ্ঞ, নয় অকৃতজ্ঞ—", words: [ { ar: "إِنَّا", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয় আমরা" }, { ar: "هَدَيْنَاهُ", pron: "হাদাইনাহু", root: "ه د ي", mean: "তাকে পথ দেখিয়েছি" }, { ar: "السَّبِيلَ", pron: "আস-সাবিলা", root: "س ب ل", mean: "পথ" }, { ar: "إِمَّا", pron: "ইম্মা", root: "ا م ا", mean: "হয়" }, { ar: "شَاكِرًا", pron: "শাকিরান", root: "ش ك ر", mean: "কৃতজ্ঞ" }, { ar: "وَإِمَّا", pron: "ওয়া-ইম্মা", root: "ا م ا", mean: "অথবা" }, { ar: "كَفُورًا", pron: "কাফুরান", root: "ك ف ر", mean: "অকৃতজ্ঞ/অস্বীকারকারী" } ] },
      { no: 4, trans: "নিশ্চয় আমরা কাফিরদের জন্য প্রস্তুত করেছি শৃঙ্খল, বেড়ি ও প্রজ্বলিত আগুন—", words: [ { ar: "إِنَّا", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয় আমরা" }, { ar: "أَعْتَدْنَا", pron: "আ'তাদনা", root: "ع ت د", mean: "প্রস্তুত করেছি" }, { ar: "لِلْكَافِرِينَ", pron: "লিল-কাফিরিনা", root: "ك ف ر", mean: "কাফিরদের জন্য" }, { ar: "سَلَاسِلَا", pron: "সালাসিলা", root: "س ل س ل", mean: "শৃঙ্খল" }, { ar: "وَأَغْلَالًا", pron: "ওয়া-আগলালান", root: "غ ل ل", mean: "বেড়ি" }, { ar: "وَسَعِيرًا", pron: "ওয়া-সা'ইরান", root: "س ع ر", mean: "প্রজ্বলিত আগুন" } ] },
      { no: 5, trans: "নিশ্চয় সৎকর্মশীলরা পান করবে কাফুর মিশ্রিত পেয়ালা—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الْأَبْرَارَ", pron: "আল-আবরারা", root: "ب ر ر", mean: "সৎকর্মশীলরা" }, { ar: "يَشْرَبُونَ", pron: "ইয়াশরাবুনা", root: "ش ر ب", mean: "পান করবে" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "كَأْسٍ", pron: "কা'সিন", root: "ك ا س", mean: "পেয়ালা" }, { ar: "كَانَ", pron: "কানা", root: "ك و ن", mean: "ছিল" }, { ar: "مِزَاجُهَا", pron: "মিজাজুহা", root: "م ز ج", mean: "তার মিশ্রণ" }, { ar: "كَافُورًا", pron: "কাফুরান", root: "ك ف ر", mean: "কাফুর/সুগন্ধি" } ] },
      { no: 6, trans: "একটি ঝর্ণা যা থেকে আল্লাহর বান্দারা পান করবে; তারা তা প্রবাহিত করবে প্রবল ধারায়—", words: [ { ar: "عَيْنًا", pron: "'আইনান", root: "ع ي ن", mean: "ঝর্ণা" }, { ar: "يَشْرَبُ", pron: "ইয়াশরাবু", root: "ش ر ب", mean: "পান করে" }, { ar: "بِهَا", pron: "বিহা", root: "ب ه", mean: "তা দ্বারা" }, { ar: "عِبَادُ", pron: "'ইবাদু", root: "ع ب د", mean: "বান্দারা" }, { ar: "اللَّهِ", pron: "আল্লাহি", root: "ا ل ه", mean: "আল্লাহর" }, { ar: "يُفَجِّرُونَهَا", pron: "ইউফাজ্জিরুনাহা", root: "ف ج ر", mean: "তারা প্রবাহিত করবে" }, { ar: "تَفْجِيرًا", pron: "তাফজিরান", root: "ف ج ر", mean: "প্রবল ধারায়" } ] },
      { no: 7, trans: "তারা মানত পূর্ণ করে এবং সেদিনের ভয় করে যার অনিষ্ট বিস্তৃত—", words: [ { ar: "يُوفُونَ", pron: "ইউফুনা", root: "و ف ي", mean: "তারা পূর্ণ করে" }, { ar: "بِالنَّذْرِ", pron: "বিন-নাযরি", root: "ن ذ ر", mean: "মানত" }, { ar: "وَيَخَافُونَ", pron: "ওয়া-ইয়াখাফুনা", root: "خ و ف", mean: "এবং ভয় করে" }, { ar: "يَوْمًا", pron: "ইয়াওমান", root: "ي و م", mean: "দিনকে" }, { ar: "كَانَ", pron: "কানা", root: "ك و ن", mean: "ছিল" }, { ar: "شَرُّهُ", pron: "শাররুহু", root: "ش ر ر", mean: "তার অনিষ্ট" }, { ar: "مُسْتَطِيرًا", pron: "মুসতাতিরান", root: "س ط ر", mean: "বিস্তৃত/ছড়িয়ে পড়া" } ] },
      { no: 8, trans: "আর তারা খাবার প্রদান করে, যদিও তারা নিজেরাও তা পছন্দ করে, মিসকিন, এতিম ও বন্দিকে—", words: [ { ar: "وَيُطْعِمُونَ", pron: "ওয়া-ইউত'ইমুনা", root: "ط ع م", mean: "এবং তারা খাবার প্রদান করে" }, { ar: "الطَّعَامَ", pron: "আত-তা'আমা", root: "ط ع م", mean: "খাবার" }, { ar: "عَلَى", pron: "'আলা", root: "ع ل ي", mean: "উপর" }, { ar: "حُبِّهِ", pron: "হুব্বিহি", root: "ح ب ب", mean: "তার ভালোবাসা/পছন্দ" }, { ar: "مِسْكِينًا", pron: "মিসকিনান", root: "س ك ن", mean: "মিসকিন/অভাবগ্রস্ত" }, { ar: "وَيَتِيمًا", pron: "ওয়া-ইয়াতিমান", root: "ي ت م", mean: "এবং এতিম" }, { ar: "وَأَسِيرًا", pron: "ওয়া-আসিরান", root: "ا س ر", mean: "এবং বন্দি" } ] },
      { no: 9, trans: "(তারা বলে) 'আমরা তোমাদেরকে শুধু আল্লাহর সন্তুষ্টির জন্য খাবার দিই; আমরা তোমাদের কাছে কোনো প্রতিদান বা কৃতজ্ঞতা চাই না।'—", words: [ { ar: "إِنَّمَا", pron: "ইন্নামা", root: "ا ن", mean: "শুধুমাত্র" }, { ar: "نُطْعِمُكُمْ", pron: "নুত'ইমুকুম", root: "ط ع م", mean: "আমরা তোমাদের খাবার দিই" }, { ar: "لِوَجْهِ", pron: "লি-ওয়াজহি", root: "و ج ه", mean: "মুখ/সত্তার জন্য" }, { ar: "اللَّهِ", pron: "আল্লাহি", root: "ا ل ه", mean: "আল্লাহর" }, { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "نُرِيدُ", pron: "নুরিদু", root: "ر و د", mean: "আমরা চাই" }, { ar: "مِنكُمْ", pron: "মিনকুম", root: "م ن", mean: "তোমাদের থেকে" }, { ar: "جَزَاءً", pron: "জাযা-আন", root: "ج ز ي", mean: "প্রতিদান" }, { ar: "وَلَا", pron: "ওয়া-লা", root: "ل ا", mean: "এবং না" }, { ar: "شُكُورًا", pron: "শুকুরান", root: "ش ك ر", mean: "কৃতজ্ঞতা" } ] },
      { no: 10, trans: "নিশ্চয় আমরা আমাদের রবের কাছে সেদিনের ভয় করি যা ভয়াবহ, দারুণ—", words: [ { ar: "إِنَّا", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয় আমরা" }, { ar: "نَخَافُ", pron: "নাখাফু", root: "خ و ف", mean: "ভয় করি" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "رَبِّنَا", pron: "রাব্বিনা", root: "ر ب ب", mean: "আমাদের রবের" }, { ar: "يَوْمًا", pron: "ইয়াওমান", root: "ي و م", mean: "দিনকে" }, { ar: "عَبُوسًا", pron: "'আবুসান", root: "ع ب س", mean: "ভয়াবহ/বিকৃত" }, { ar: "قَمْطَرِيرًا", pron: "কামতারিরান", root: "ق م ط ر", mean: "দারুণ/কঠোর" } ] },
      { no: 11, trans: "অতঃপর আল্লাহ তাদেরকে সেই দিনের অনিষ্ট থেকে রক্ষা করবেন এবং তাদেরকে সজীবতা ও আনন্দ দান করবেন—", words: [ { ar: "فَوَقَاهُمُ", pron: "ফা-ওয়াকাহুমু", root: "و ق ي", mean: "অতঃপর তিনি তাদের রক্ষা করলেন" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "شَرَّ", pron: "শাররা", root: "ش ر ر", mean: "অনিষ্ট" }, { ar: "ذَٰلِكَ", pron: "যালিকা", root: "ذ ل ك", mean: "সেই" }, { ar: "الْيَوْمِ", pron: "আল-ইয়াওমি", root: "ي و م", mean: "দিনের" }, { ar: "وَلَقَّاهُمْ", pron: "ওয়া-লাক্কাহুম", root: "ل ق ي", mean: "এবং তাদের দান করলেন" }, { ar: "نَضْرَةً", pron: "নাদরাতান", root: "ن ض ر", mean: "সজীবতা/উজ্জ্বলতা" }, { ar: "وَسُرُورًا", pron: "ওয়া-সুরুরান", root: "س ر ر", mean: "এবং আনন্দ" } ] },
      { no: 12, trans: "আর তাদের ধৈর্যের কারণে তাদেরকে পুরস্কৃত করবেন জান্নাত ও রেশমি পোশাক দিয়ে—", words: [ { ar: "وَجَزَاهُمْ", pron: "ওয়া-জাযাহুম", root: "ج ز ي", mean: "এবং তাদের পুরস্কৃত করলেন" }, { ar: "بِمَا", pron: "বি-মা", root: "م ا", mean: "যা" }, { ar: "صَبَرُوا", pron: "সাবারু", root: "ص ب ر", mean: "তারা ধৈর্য ধারণ করেছিল" }, { ar: "جَنَّةً", pron: "জান্নাতান", root: "ج ن ن", mean: "উদ্যান" }, { ar: "وَحَرِيرًا", pron: "ওয়া-হারিরান", root: "ح ر ر", mean: "এবং রেশমি পোশাক" } ] },
