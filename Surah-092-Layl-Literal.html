      { no: 3, trans: "শপথ তাঁর যিনি পুরুষ ও নারী সৃষ্টি করেছেন—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "শপথ যা" }, { ar: "خَلَقَ", pron: "খালাকা", root: "خ ل ق", mean: "সৃষ্টি করেছেন" }, { ar: "الذَّكَرَ", pron: "আয-যাকারা", root: "ذ ك ر", mean: "পুরুষ" }, { ar: "وَالْأُنثَى", pron: "ওয়াল-উনসা", root: "ا ن ث", mean: "এবং নারী" } ] },
      { no: 4, trans: "নিশ্চয় তোমাদের প্রচেষ্টা ভিন্ন ভিন্ন—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "سَعْيَكُمْ", pron: "সা'ইয়াকুম", root: "س ع ي", mean: "তোমাদের প্রচেষ্টা" }, { ar: "لَشَتَّى", pron: "লা-শাত্তা", root: "ش ت ت", mean: "অবশ্যই ভিন্ন/বিচ্ছিন্ন" } ] },

      { no: 6, trans: "আর সৎকর্মকে সত্যায়ন করে—", words: [ { ar: "وَصَدَّقَ", pron: "ওয়া-সাদ্দাক্বা", root: "ص د ق", mean: "এবং সত্যায়ন করে" }, { ar: "بِالْحُسْنَى", pron: "বিল-হুসনা", root: "ح س ن", mean: "সৎকর্ম/উত্তম বিষয়কে" } ] },
      { no: 7, trans: "অতঃপর আমরা তাকে সহজ পথের সুবিধা দেব—", words: [ { ar: "فَسَنُيَسِّرُهُ", pron: "ফা-সানুয়াসসিরুহু", root: "ي س ر", mean: "অতঃপর আমরা তাকে সহজ করব" }, { ar: "لِلْيُسْرَى", pron: "লিল-ইউসরা", root: "ي س ر", mean: "সহজ পথের জন্য" } ] },
      { no: 8, trans: "আর যে কৃপণতা করে এবং নিজেকে অমুখাপেক্ষী মনে করে—", words: [ { ar: "وَأَمَّا", pron: "ওয়া-আম্মা", root: "ا م ا", mean: "আর যে" }, { ar: "مَنْ", pron: "মান", root: "م ن", mean: "যে" }, { ar: "بَخِلَ", pron: "বাখিলা", root: "ب خ ل", mean: "কৃপণতা করে" }, { ar: "وَاسْتَغْنَى", pron: "ওয়াস-তাগনা", root: "غ ن ي", mean: "এবং অমুখাপেক্ষী/ধনী মনে করে" } ] },
      { no: 9, trans: "আর সৎকর্মকে মিথ্যা প্রতিপন্ন করে—", words: [ { ar: "وَكَذَّبَ", pron: "ওয়া-কায্যাবা", root: "ك ذ ب", mean: "এবং মিথ্যা প্রতিপন্ন করে" }, { ar: "بِالْحُسْنَى", pron: "বিল-হুসনা", root: "ح س ن", mean: "সৎকর্মকে" } ] },
      { no: 10, trans: "অতঃপর আমরা তাকে কষ্টের পথের সুবিধা দেব—", words: [ { ar: "فَسَنُيَسِّرُهُ", pron: "ফা-সানুয়াসসিরুহু", root: "ي س ر", mean: "অতঃপর আমরা তাকে সহজ করব" }, { ar: "لِلْعُسْرَى", pron: "লিল-'উসরা", root: "ع س ر", mean: "কষ্টের পথের জন্য" } ] },

      { no: 12, trans: "নিশ্চয় পথ দেখানো আমাদের দায়িত্ব—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "عَلَيْنَا", pron: "'আলায়না", root: "ع ل ي", mean: "আমাদের উপর" }, { ar: "لَلْهُدَى", pron: "লাল-হুদা", root: "ه د ي", mean: "অবশ্যই পথ দেখানো" } ] },
      { no: 13, trans: "আর নিশ্চয় শেষ জীবন ও প্রথম জীবন আমাদেরই—", words: [ { ar: "وَإِنَّ", pron: "ওয়া-ইন্না", root: "ا ن", mean: "এবং নিশ্চয়" }, { ar: "لَنَا", pron: "লানা", root: "ل ن ا", mean: "আমাদেরই" }, { ar: "لَلْآخِرَةَ", pron: "লাল-আখিরাতা", root: "ا خ ر", mean: "অবশ্যই শেষ জীবন" }, { ar: "وَالْأُولَى", pron: "ওয়াল-উলা", root: "ا و ل", mean: "এবং প্রথম জীবন" } ] },
      { no: 14, trans: "তাই আমি তোমাদেরকে প্রজ্বলিত আগুন সম্পর্কে সতর্ক করছি—", words: [ { ar: "فَأَنذَرْتُكُمْ", pron: "ফা-আনযারতুকুম", root: "ن ذ ر", mean: "অতএব আমি সতর্ক করছি" }, { ar: "نَارًا", pron: "নারান", root: "ن و ر", mean: "আগুন" }, { ar: "تَلَظَّى", pron: "তালায্যা", root: "ل ظ ي", mean: "প্রজ্বলিত/ভয়ানক" } ] },
      { no: 15, trans: "যাতে প্রবেশ করবে না কিন্তু সেই হতভাগ্য—", words: [ { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "يَصْلَاهَا", pron: "ইয়াসলাহা", root: "ص ل ي", mean: "প্রবেশ করবে" }, { ar: "إِلَّا", pron: "ইল্লা", root: "ا ل ل", mean: "ছাড়া" }, { ar: "الْأَشْقَى", pron: "আল-আশক্বা", root: "ش ق و", mean: "হতভাগ্য" } ] },
      { no: 16, trans: "যে মিথ্যা প্রতিপন্ন করেছে এবং মুখ ফিরিয়েছে—", words: [ { ar: "الَّذِي", pron: "আল্লাযি", root: "ا ل ل ذ", mean: "যে" }, { ar: "كَذَّبَ", pron: "কায্যাবা", root: "ك ذ ب", mean: "মিথ্যা প্রতিপন্ন করেছে" }, { ar: "وَتَوَلَّى", pron: "ওয়া-তাওয়াল্লা", root: "و ل ي", mean: "এবং মুখ ফিরিয়েছে" } ] },

      { no: 19, trans: "আর কারও কাছে তার কোনো অনুগ্রহ নেই যা প্রতিদান দেওয়া হবে—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "এবং না" }, { ar: "لِأَحَدٍ", pron: "লি-আহাদিন", root: "ا ح د", mean: "কারও জন্য" }, { ar: "عِنْدَهُ", pron: "'ইন্দাহু", root: "ع ن د", mean: "তার কাছে" }, { ar: "مِنْ", pron: "মিন", root: "م ن", mean: "থেকে" }, { ar: "نِعْمَةٍ", pron: "নি'মাতিন", root: "ن ع م", mean: "অনুগ্রহ" }, { ar: "تُجْزَى", pron: "তুজা", root: "ج ز ي", mean: "প্রতিদান দেওয়া হয়" } ] },
      { no: 20, trans: "শুধুমাত্র তাঁর মহান রবের সন্তুষ্টি লাভের জন্য—", words: [ { ar: "إِلَّا", pron: "ইল্লা", root: "ا ل ل", mean: "ছাড়া/শুধুমাত্র" }, { ar: "ابْتِغَاءَ", pron: "ইবতিগা-আ", root: "ب غ ي", mean: "অন্বেষণ/সন্ধান" }, { ar: "وَجْهِ", pron: "ওয়াজহি", root: "و ج ه", mean: "মুখ/সত্তা" }, { ar: "رَبِّهِ", pron: "রাব্বিহি", root: "ر ب ب", mean: "তার রবের" }, { ar: "الْأَعْلَى", pron: "আল-আ'লা", root: "ع ل و", mean: "মহান/উচ্চ" } ] },
