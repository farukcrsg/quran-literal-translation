            const ayahData = [
      { no: 1, trans: "তিনি ভ্রুকুটি করলেন এবং মুখ ফিরিয়ে নিলেন—", words: [ { ar: "عَبَسَ", pron: "'আবাসা", root: "ع ب س", mean: "ভ্রুকুটি করলেন" }, { ar: "وَتَوَلَّى", pron: "ওয়া-তাওয়াল্লা", root: "و ل ي", mean: "এবং মুখ ফিরিয়ে নিলেন" } ] },
      { no: 2, trans: "কারণ তার কাছে অন্ধ ব্যক্তি এসেছিল—", words: [ { ar: "أَن", pron: "আন", root: "ا ن", mean: "কারণ" }, { ar: "جَاءَهُ", pron: "জা-আহু", root: "ج ي ا", mean: "তার কাছে এসেছিল" }, { ar: "الْأَعْمَى", pron: "আল-আ'মা", root: "ع م ي", mean: "অন্ধ ব্যক্তি" } ] },

      { no: 14, trans: "উচ্চ মর্যাদাসম্পন্ন, পবিত্র—", words: [ { ar: "مَّرْفُوعَةٍ", pron: "মারফু'আতিন", root: "ر ف ع", mean: "উচ্চ মর্যাদাসম্পন্ন" }, { ar: "مُّطَهَّرَةٍ", pron: "মুতাহ্হারাতিন", root: "ط ه ر", mean: "পবিত্র" } ] },
      { no: 15, trans: "লেখকদের হাতে (লিখিত)—", words: [ { ar: "بِأَيْدِي", pron: "বি-আইদি", root: "ي د ي", mean: "হাতে" }, { ar: "سَفَرَةٍ", pron: "সাফারাতিন", root: "س ف ر", mean: "লেখকদের" } ] },
      { no: 16, trans: "সম্মানিত, সৎকর্মশীল—", words: [ { ar: "كِرَامٍ", pron: "কিরামিন", root: "ك ر م", mean: "সম্মানিত" }, { ar: "بَرَرَةٍ", pron: "বারারাতিন", root: "ب ر ر", mean: "সৎকর্মশীল" } ] },
      { no: 17, trans: "মানুষ ধ্বংস হোক! কী কুফরি তাকে করেছে!—", words: [ { ar: "قُتِلَ", pron: "কুতিলা", root: "ق ت ل", mean: "ধ্বংস হোক" }, { ar: "الْإِنسَانُ", pron: "আল-ইনসানু", root: "ا ن س", mean: "মানুষ" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "أَكْفَرَهُ", pron: "আকফারাহু", root: "ك ف ر", mean: "তাকে কুফরি করেছে" } ] },
      { no: 18, trans: "কী বস্তু থেকে তিনি তাকে সৃষ্টি করেছেন?—", words: [ { ar: "مِن", pron: "মিন", root: "م ن", mean: "কী থেকে" }, { ar: "أَيِّ", pron: "আইয়্যি", root: "ا ي", mean: "কী" }, { ar: "شَيْءٍ", pron: "শাইইন", root: "ش ي ا", mean: "বস্তু" }, { ar: "خَلَقَهُ", pron: "খালাক্বাহু", root: "خ ل ق", mean: "তাকে সৃষ্টি করেছেন" } ] },
