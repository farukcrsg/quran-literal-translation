            const ayahData = [
      { no: 1, trans: "শপথ কর্তৃপক্ষ যারা পূর্ণভাবে টেনে বের করে—", words: [ { ar: "وَالنَّازِعَاتِ", pron: "ওয়ান-নাযি'আতি", root: "ن ز ع", mean: "শপথ টেনে বেরকারী" }, { ar: "غَرْقًا", pron: "গারক্বান", root: "غ ر ق", mean: "পূর্ণভাবে/ডুবিয়ে" } ] },
      { no: 2, trans: "শপথ উন্মোচনকারীদের যারা উন্মোচন করে—", words: [ { ar: "وَالنَّاشِطَاتِ", pron: "ওয়ান-নাশিত্বাতি", root: "ن ش ط", mean: "শপথ উন্মোচনকারী" }, { ar: "نَشْطًا", pron: "নাশত্বান", root: "ن ش ط", mean: "উন্মোচন" } ] },

      { no: 4, trans: "অতঃপর অগ্রগামীদের যারা অগ্রসর হয়—", words: [ { ar: "فَالسَّابِقَاتِ", pron: "ফাস-সাবিক্বাতি", root: "س ب ق", mean: "অতঃপর অগ্রগামী" }, { ar: "سَبْقًا", pron: "সাবক্বান", root: "س ب ق", mean: "অগ্রগমন" } ] },
      { no: 5, trans: "অতঃপর কার্য পরিচালনাকারীদের—", words: [ { ar: "فَالْمُدَبِّرَاتِ", pron: "ফাল-মুদাব্বিরাতি", root: "د ب ر", mean: "অতঃপর কার্য পরিচালনাকারী" }, { ar: "أَمْرًا", pron: "আমরান", root: "ا م ر", mean: "কার্য" } ] },

      { no: 8, trans: "সেদিন অন্তরসমূহ প্রকম্পিত হবে—", words: [ { ar: "قُلُوبٌ", pron: "কুলুবুন", root: "ق ل ب", mean: "অন্তরসমূহ" }, { ar: "يَوْمَئِذٍ", pron: "ইয়াওমা-ইযিন", root: "ي و م", mean: "সেদিন" }, { ar: "وَاجِفَةٌ", pron: "ওয়াজিফাতুন", root: "و ج ف", mean: "প্রকম্পিত" } ] },
      { no: 9, trans: "তাদের দৃষ্টি হবে অধোমুখী—", words: [ { ar: "أَبْصَارُهَا", pron: "আবসারুহা", root: "ب ص ر", mean: "তাদের দৃষ্টি" }, { ar: "خَاشِعَةٌ", pron: "খাশি'আতুন", root: "خ ش ع", mean: "অধোমুখী" } ] },

      { no: 12, trans: "তারা বলে, 'তা হলে এটা হবে ক্ষতিকর প্রত্যাবর্তন।'—", words: [ { ar: "قَالُوا", pron: "কালু", root: "ق و ل", mean: "তারা বলে" }, { ar: "تِلْكَ", pron: "তিলকা", root: "ت ل ك", mean: "এটা" }, { ar: "إِذًا", pron: "ইযান", root: "ا ذ", mean: "তা হলে" }, { ar: "كَرَّةٌ", pron: "কাররাতুন", root: "ك ر ر", mean: "প্রত্যাবর্তন" }, { ar: "خَاسِرَةٌ", pron: "খাসিরাতুন", root: "خ س ر", mean: "ক্ষতিকর" } ] },
      { no: 13, trans: "অতএব তা হবে একক সজোরে ধ্বনি—", words: [ { ar: "فَإِنَّمَا", pron: "ফা-ইন্নামা", root: "ا ن", mean: "অতএব শুধু" }, { ar: "هِيَ", pron: "হিয়া", root: "ه ي", mean: "তা" }, { ar: "زَجْرَةٌ", pron: "যাজরাতুন", root: "ز ج ر", mean: "সজোরে ধ্বনি" }, { ar: "وَاحِدَةٌ", pron: "ওয়াহিদাতুন", root: "و ح د", mean: "একক" } ] },
      { no: 14, trans: "অতঃপর তারা হঠাৎ ময়দানে উপস্থিত হবে—", words: [ { ar: "فَإِذَا", pron: "ফা-ইযা", root: "ا ذ ا", mean: "অতঃপর হঠাৎ" }, { ar: "هُم", pron: "হুম", root: "ه م", mean: "তারা" }, { ar: "بِالسَّاهِرَةِ", pron: "বিস-সাহিরাতি", root: "س ه ر", mean: "ময়দানে/উন্মুক্ত প্রান্তরে" } ] },
      { no: 15, trans: "তোমার কাছে কি মূসার সংবাদ এসেছে?—", words: [ { ar: "هَلْ", pron: "হাল", root: "ه ل", mean: "কি" }, { ar: "أَتَاكَ", pron: "আতাকা", root: "ا ت ي", mean: "তোমার কাছে এসেছে" }, { ar: "حَدِيثُ", pron: "হাদিসু", root: "ح د ث", mean: "সংবাদ" }, { ar: "مُوسَى", pron: "মুসা", root: "م و س", mean: "মূসার" } ] },
      { no: 16, trans: "যখন তার রব তাকে পবিত্র উপত্যকা তুওয়ায় ডাকলেন—", words: [ { ar: "إِذْ", pron: "ইয", root: "ا ذ", mean: "যখন" }, { ar: "نَادَاهُ", pron: "নাদাহু", root: "ن د و", mean: "ডাকলেন" }, { ar: "رَبُّهُ", pron: "রাব্বুহু", root: "ر ب ب", mean: "তার রব" }, { ar: "بِالْوَادِ", pron: "বিল-ওয়াদি", root: "و د ي", mean: "উপত্যকায়" }, { ar: "الْمُقَدَّسِ", pron: "আল-মুকাদ্দাসি", root: "ق د س", mean: "পবিত্র" }, { ar: "طُوًى", pron: "তুওয়ান", root: "ط و ي", mean: "তুওয়া" } ] },
      { no: 17, trans: "'ফিরআউনের কাছে যাও; নিশ্চয় সে বিদ্রোহ করেছে।'—", words: [ { ar: "اذْهَبْ", pron: "ইযহাব", root: "ذ ه ب", mean: "যাও" }, { ar: "إِلَى", pron: "ইলা", root: "ا ل ي", mean: "কাছে" }, { ar: "فِرْعَوْنَ", pron: "ফির'আউনা", root: "ف ر ع ن", mean: "ফিরআউনের" }, { ar: "إِنَّهُ", pron: "ইন্নাহু", root: "ا ن", mean: "নিশ্চয় সে" }, { ar: "طَغَى", pron: "তাগা", root: "ط غ و", mean: "বিদ্রোহ করেছে" } ] },
      { no: 18, trans: "অতঃপর বলো, 'তোমার আগ্রহ আছে কি পবিত্র হওয়ার?—", words: [ { ar: "فَقُلْ", pron: "ফা-কুল", root: "ق و ل", mean: "অতঃপর বলো" }, { ar: "هَل", pron: "হাল", root: "ه ل", mean: "কি" }, { ar: "لَّكَ", pron: "লাকা", root: "ل ك", mean: "তোমার" }, { ar: "إِلَى", pron: "ইলা", root: "ا ل ي", mean: "দিকে" }, { ar: "أَن", pron: "আন", root: "ا ن", mean: "যে" }, { ar: "تَزَكَّى", pron: "তাযাক্কা", root: "ز ك و", mean: "পবিত্র হও" } ] },
      { no: 19, trans: "আর আমি তোমাকে তোমার রবের দিকে পথ দেখাব, অতঃপর তুমি ভয় করবে।'—", words: [ { ar: "وَأَهْدِيَكَ", pron: "ওয়া-আহদিয়াকা", root: "ه د ي", mean: "এবং আমি তোমাকে পথ দেখাব" }, { ar: "إِلَى", pron: "ইলা", root: "ا ل ي", mean: "দিকে" }, { ar: "رَبِّكَ", pron: "রাব্বিকা", root: "ر ب ب", mean: "তোমার রবের" }, { ar: "فَتَخْشَى", pron: "ফা-তাখশা", root: "خ ش ي", mean: "অতঃপর তুমি ভয় করবে" } ] },
      { no: 20, trans: "অতঃপর তাকে মহান নিদর্শন দেখালেন—", words: [ { ar: "فَأَرَاهُ", pron: "ফা-আরাহু", root: "ر ا ي", mean: "অতঃপর তাকে দেখালেন" }, { ar: "الْآيَةَ", pron: "আল-আয়াতা", root: "ا ي ن", mean: "নিদর্শন" }, { ar: "الْكُبْرَى", pron: "আল-কুবরা", root: "ك ب ر", mean: "মহান" } ] },
      { no: 21, trans: "অতঃপর সে মিথ্যা প্রতিপন্ন করল এবং অবাধ্য হল—", words: [ { ar: "فَكَذَّبَ", pron: "ফা-কায্যাবা", root: "ك ذ ب", mean: "অতঃপর সে মিথ্যা প্রতিপন্ন করল" }, { ar: "وَعَصَى", pron: "ওয়া-'আসা", root: "ع ص ي", mean: "এবং অবাধ্য হল" } ] },
      { no: 22, trans: "অতঃপর সে মুখ ফিরিয়ে নিল এবং সংগ্রামে নামল—", words: [ { ar: "ثُمَّ", pron: "সুম্মা", root: "ث م م", mean: "অতঃপর" }, { ar: "أَدْبَرَ", pron: "আদবারা", root: "د ب ر", mean: "মুখ ফিরিয়ে নিল" }, { ar: "يَسْعَى", pron: "ইয়াস'আ", root: "س ع ي", mean: "সংগ্রামে নামল" } ] },
      { no: 23, trans: "অতঃপর সে (সমর্থকদের) একত্র করল এবং ঘোষণা করল—", words: [ { ar: "فَحَشَرَ", pron: "ফা-হাশারা", root: "ح ش ر", mean: "অতঃপর একত্র করল" }, { ar: "فَنَادَى", pron: "ফা-নাদা", root: "ن د و", mean: "এবং ঘোষণা করল" } ] },
