          <script type="text/babel">
            const { useState, useEffect } = React;

            const STORAGE_PREFIX = "surah_082_note_";
            const ayahData = [
      { no: 1, trans: "যখন আকাশ বিদীর্ণ হবে—", words: [ { ar: "إِذَا", pron: "ইযা", root: "ا ذ ا", mean: "যখন" }, { ar: "السَّمَاءُ", pron: "আস-সামা-উ", root: "س م و", mean: "আকাশ" }, { ar: "انفَطَرَتْ", pron: "ইনফাতারাত", root: "ف ط ر", mean: "বিদীর্ণ হবে" } ] },
      { no: 2, trans: "যখন তারাকসমূহ ঝরে পড়বে—", words: [ { ar: "وَإِذَا", pron: "ওয়া-ইযা", root: "ا ذ ا", mean: "এবং যখন" }, { ar: "الْكَوَاكِبُ", pron: "আল-কাওয়াকিবু", root: "ك و ك ب", mean: "তারাকসমূহ" }, { ar: "انتَثَرَتْ", pron: "ইনতাসারাত", root: "ن ث ر", mean: "ঝরে পড়বে" } ] },
      { no: 3, trans: "যখন সমুদ্রসমূহ উচ্ছ্বসিত হবে—", words: [ { ar: "وَإِذَا", pron: "ওয়া-ইযা", root: "ا ذ ا", mean: "এবং যখন" }, { ar: "الْبِحَارُ", pron: "আল-বিহারু", root: "ب ح ر", mean: "সমুদ্রসমূহ" }, { ar: "فُجِّرَتْ", pron: "ফুজ্জিরাত", root: "ف ج ر", mean: "উচ্ছ্বসিত/প্রবাহিত হবে" } ] },
      { no: 4, trans: "যখন কবরসমূহ উন্মোচিত হবে—", words: [ { ar: "وَإِذَا", pron: "ওয়া-ইযা", root: "ا ذ ا", mean: "এবং যখন" }, { ar: "الْقُبُورُ", pron: "আল-কুবুরু", root: "ق ب ر", mean: "কবরসমূহ" }, { ar: "بُعْثِرَتْ", pron: "বু'সিরাত", root: "ب ع ث ر", mean: "উন্মোচিত হবে" } ] },
      { no: 5, trans: "(তখন) প্রত্যেক ব্যক্তি জানতে পারবে সে কী আগে পাঠিয়েছে ও কী পিছনে রেখে গেছে—", words: [ { ar: "عَلِمَتْ", pron: "'আলিমাত", root: "ع ل م", mean: "জানতে পারবে" }, { ar: "نَفْسٌ", pron: "নাফসুন", root: "ن ف س", mean: "প্রত্যেক ব্যক্তি" }, { ar: "مَّا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "قَدَّمَتْ", pron: "ক্বাদ্দামাত", root: "ق د م", mean: "আগে পাঠিয়েছে" }, { ar: "وَأَخَّرَتْ", pron: "ওয়া-আখখারাত", root: "ا خ ر", mean: "এবং কী পিছনে রেখে গেছে" } ] },
      { no: 6, trans: "হে মানুষ! কী তোমাকে তোমার মহান রবের ব্যাপারে প্রতারণা করল?—", words: [ { ar: "يَا", pron: "ইয়া", root: "ي ا", mean: "হে" }, { ar: "أَيُّهَا", pron: "আইয়ুহা", root: "ا ي", mean: "যারা" }, { ar: "الْإِنسَانُ", pron: "আল-ইনসানু", root: "ا ن س", mean: "মানুষ" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "غَرَّكَ", pron: "গাররাকা", root: "غ ر ر", mean: "তোমাকে প্রতারণা করল" }, { ar: "بِرَبِّكَ", pron: "বি-রাব্বিকা", root: "ر ب ب", mean: "তোমার রবের ব্যাপারে" }, { ar: "الْكَرِيمِ", pron: "আল-কারিমি", root: "ك ر م", mean: "মহান" } ] },
      { no: 7, trans: "যিনি তোমাকে সৃষ্টি করেছেন, অতঃপর সুশৃঙ্খল করেছেন, অতঃপর সামঞ্জস্য দিয়েছেন—", words: [ { ar: "الَّذِي", pron: "আল্লাযি", root: "ا ل ل ذ", mean: "যিনি" }, { ar: "خَلَقَكَ", pron: "খালাকাকা", root: "خ ل ق", mean: "তোমাকে সৃষ্টি করেছেন" }, { ar: "فَسَوَّاكَ", pron: "ফা-সাওয়াকা", root: "س و ي", mean: "অতঃপর তোমাকে সুশৃঙ্খল করেছেন" }, { ar: "فَعَدَلَكَ", pron: "ফা-'আদালাকা", root: "ع د ل", mean: "অতঃপর তোমাকে সামঞ্জস্য দিয়েছেন" } ] },
      { no: 8, trans: "যেকোনো রূপে তিনি চেয়েছেন, তোমাকে গঠন করেছেন—", words: [ { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "أَيِّ", pron: "আইয়্যি", root: "ا ي", mean: "যেকোনো" }, { ar: "صُورَةٍ", pron: "সুরাতিন", root: "ص و ر", mean: "রূপে" }, { ar: "مَّا", pron: "মা", root: "م ا", mean: "যা" }, { ar: "شَاءَ", pron: "শা-আ", root: "ش ي ا", mean: "তিনি চেয়েছেন" }, { ar: "رَكَّبَكَ", pron: "রাক্কাবাকা", root: "ر ك ب", mean: "তোমাকে গঠন করেছেন" } ] },
      { no: 9, trans: "কখনো না! বরং তোমরা প্রতিদানকে মিথ্যা প্রতিপন্ন করো—", words: [ { ar: "كَلَّا", pron: "কাল্লা", root: "ك ل ا", mean: "কখনো না" }, { ar: "بَلْ", pron: "বাল", root: "ب ل", mean: "বরং" }, { ar: "تُكَذِّبُونَ", pron: "তুকায্যিবুনা", root: "ك ذ ب", mean: "তোমরা মিথ্যা প্রতিপন্ন করো" }, { ar: "بِالدِّينِ", pron: "বিদ-দিনি", root: "د ي ن", mean: "প্রতিদানকে" } ] },
      { no: 10, trans: "আর নিশ্চয় তোমাদের উপর রক্ষক ফেরেশতা নিযুক্ত আছে—", words: [ { ar: "وَإِنَّ", pron: "ওয়া-ইন্না", root: "ا ن", mean: "আর নিশ্চয়" }, { ar: "عَلَيْكُمْ", pron: "'আলাইকুম", root: "ع ل ي", mean: "তোমাদের উপর" }, { ar: "لَحَافِظِينَ", pron: "লা-হাফিদ্বিনা", root: "ح ف ظ", mean: "অবশ্যই রক্ষক" } ] },
      { no: 11, trans: "সম্মানিত লেখক ফেরেশতা—", words: [ { ar: "كِرَامًا", pron: "কিরামান", root: "ك ر م", mean: "সম্মানিত" }, { ar: "كَاتِبِينَ", pron: "কাতিবিনা", root: "ك ت ب", mean: "লেখক" } ] },
      { no: 12, trans: "তারা জানে যা তোমরা করো—", words: [ { ar: "يَعْلَمُونَ", pron: "ইয়া'লামুনা", root: "ع ل م", mean: "তারা জানে" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "যা" }, { ar: "تَفْعَلُونَ", pron: "তাফ'আলুনা", root: "ف ع ل", mean: "তোমরা করো" } ] },
      { no: 13, trans: "নিশ্চয় সৎকর্মশীলরা থাকবে অবিরাম সুখে—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الْأَبْرَارَ", pron: "আল-আবরারা", root: "ب ر ر", mean: "সৎকর্মশীলরা" }, { ar: "لَفِي", pron: "লা-ফি", root: "ف ي", mean: "অবশ্যই মধ্যে" }, { ar: "نَعِيمٍ", pron: "না'ইমিন", root: "ن ع م", mean: "সুখ" } ] },
      { no: 14, trans: "আর পাপিষ্ঠরা থাকবে জাহান্নামে—", words: [ { ar: "وَإِنَّ", pron: "ওয়া-ইন্না", root: "ا ن", mean: "আর নিশ্চয়" }, { ar: "الْفُجَّارَ", pron: "আল-ফুজ্জারা", root: "ف ج ر", mean: "পাপিষ্ঠরা" }, { ar: "لَفِي", pron: "লা-ফি", root: "ف ي", mean: "অবশ্যই মধ্যে" }, { ar: "جَحِيمٍ", pron: "জাহিমিন", root: "ج ح م", mean: "জাহান্নাম" } ] },
      { no: 15, trans: "যাতে তারা প্রবেশ করবে প্রতিদান দিবসে—", words: [ { ar: "يَصْلَوْنَهَا", pron: "ইয়াসলাওনাহা", root: "ص ل ي", mean: "তারা প্রবেশ করবে" }, { ar: "يَوْمَ", pron: "ইয়াওমা", root: "ي و م", mean: "দিনে" }, { ar: "الدِّينِ", pron: "আদ-দিনি", root: "د ي ن", mean: "প্রতিদান" } ] },
      { no: 16, trans: "আর তারা তা থেকে অদৃশ্য হবে না—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "আর না" }, { ar: "هُمْ", pron: "হুম", root: "ه م", mean: "তারা" }, { ar: "عَنْهَا", pron: "'আনহা", root: "ع ن", mean: "তা থেকে" }, { ar: "بِغَائِبِينَ", pron: "বি-গা-ইবিনা", root: "غ ي ب", mean: "অদৃশ্য" } ] },
      { no: 17, trans: "আর তুমি কী জানো প্রতিদান দিবস কী?—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "আর কী" }, { ar: "أَدْرَاكَ", pron: "আদরাকা", root: "د ر ك", mean: "তোমাকে জানাল" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "يَوْمُ", pron: "ইয়াওমু", root: "ي و م", mean: "দিন" }, { ar: "الدِّينِ", pron: "আদ-দিনি", root: "د ي ن", mean: "প্রতিদান" } ] },
      { no: 18, trans: "আবারও তুমি কী জানো প্রতিদান দিবস কী?—", words: [ { ar: "ثُمَّ", pron: "সুম্মা", root: "ث م م", mean: "আবারও" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "أَدْرَاكَ", pron: "আদরাকা", root: "د ر ك", mean: "তোমাকে জানাল" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কী" }, { ar: "يَوْمُ", pron: "ইয়াওমু", root: "ي و م", mean: "দিন" }, { ar: "الدِّينِ", pron: "আদ-দিনি", root: "د ي ن", mean: "প্রতিদান" } ] },
      { no: 19, trans: "যেদিন কোনো ব্যক্তি অন্যের কোনো কাজে আসবে না; আর সেদিন সব কর্তৃত্ব আল্লাহর হবে।—", words: [ { ar: "يَوْمَ", pron: "ইয়াওমা", root: "ي و م", mean: "যেদিন" }, { ar: "لَا", pron: "লা", root: "ل ا", mean: "না" }, { ar: "تَمْلِكُ", pron: "তামলিকু", root: "م ل ك", mean: "কাজে আসবে/অধিকার রাখবে" }, { ar: "نَفْسٌ", pron: "নাফসুন", root: "ن ف س", mean: "কোনো ব্যক্তি" }, { ar: "لِّنَفْسٍ", pron: "লি-নাফসিন", root: "ن ف س", mean: "অন্যের" }, { ar: "شَيْئًا", pron: "শাইয়ান", root: "ش ي ا", mean: "কিছু" }, { ar: "وَالْأَمْرُ", pron: "ওয়াল-আমরু", root: "ا م ر", mean: "এবং কর্তৃত্ব" }, { ar: "يَوْمَئِذٍ", pron: "ইয়াওমা-ইযিন", root: "ي و م", mean: "সেদিন" }, { ar: "لِلَّهِ", pron: "লিল-লাহি", root: "ا ل ه", mean: "আল্লাহর" } ] }
    ];

            function App() {
              const [msg, setMsg] = useState("");
              const [notes, setNotes] = useState({});
              const [saved, setSaved] = useState({});

              useEffect(() => {
                const savedNotes = {};
                ayahData.forEach((ayah, idx) => {
                  const key = STORAGE_PREFIX + idx;
                  const val = localStorage.getItem(key);
                  if (val) savedNotes[idx] = val;
                });
                setNotes(savedNotes);
              }, []);

              const handleNoteChange = (idx, value) => {
                const key = STORAGE_PREFIX + idx;
                localStorage.setItem(key, value);
                setNotes(prev => ({ ...prev, [idx]: value }));
                setSaved(prev => ({ ...prev, [idx]: true }));

                        <div className="relative z-10">

                            <span className="h-2 w-2 rounded-full bg-emerald-300 animate-pulse"></span> 082তম সূরা
                          </div>
                          <h1 className="amiri text-[42px] md:text-[56px] font-bold leading-none text-white tracking-wide">سُورَةُ Al</h1>
