            const ayahData = [

      { no: 2, trans: "শপথ প্রতিশ্রুত দিনের—", words: [ { ar: "وَالْيَوْمِ", pron: "ওয়াল-ইয়াওমি", root: "ي و م", mean: "শপথ দিনের" }, { ar: "الْمَوْعُودِ", pron: "আল-মাও'উদি", root: "و ع د", mean: "প্রতিশ্রুত" } ] },

      { no: 4, trans: "ধ্বংস হোক খাদকাহকারীরা—", words: [ { ar: "قُتِلَ", pron: "কুতিলা", root: "ق ت ل", mean: "ধ্বংস হোক" }, { ar: "أَصْحَابُ", pron: "আসহাবু", root: "ص ح ب", mean: "অধিকারী/সঙ্গী" }, { ar: "الْأُخْدُودِ", pron: "আল-উখদুদি", root: "خ د د", mean: "খাদ/পরিখা" } ] },
      { no: 5, trans: "যা ছিল প্রজ্বলিত আগুনের—", words: [ { ar: "النَّارِ", pron: "আন-নারি", root: "ن و ر", mean: "আগুনের" }, { ar: "ذَاتِ", pron: "যাতি", root: "ذ و", mean: "যুক্ত" }, { ar: "الْوَقُودِ", pron: "আল-ওয়াকুদি", root: "و ق د", mean: "প্রজ্বলিত/ইন্ধন" } ] },
      { no: 6, trans: "যখন তারা তার পাশে বসেছিল—", words: [ { ar: "إِذْ", pron: "ইয", root: "ا ذ", mean: "যখন" }, { ar: "هُمْ", pron: "হুম", root: "ه م", mean: "তারা" }, { ar: "عَلَيْهَا", pron: "'আলাইহা", root: "ع ل ي", mean: "তার পাশে" }, { ar: "قُعُودٌ", pron: "কু'উদুন", root: "ق ع د", mean: "বসেছিল" } ] },
      { no: 7, trans: "আর তারা মুমিনদের প্রতি যা করত, তারা তার সাক্ষী ছিল—", words: [ { ar: "وَهُمْ", pron: "ওয়া-হুম", root: "ه م", mean: "আর তারা" }, { ar: "عَلَى", pron: "'আলা", root: "ع ل ي", mean: "উপর" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "যা" }, { ar: "يَفْعَلُونَ", pron: "ইয়াফ'আলুনা", root: "ف ع ل", mean: "তারা করত" }, { ar: "بِالْمُؤْمِنِينَ", pron: "বিল-মু'মিনিনা", root: "ا م ن", mean: "মুমিনদের প্রতি" }, { ar: "شُهُودٌ", pron: "শুহুদুন", root: "ش ه د", mean: "সাক্ষী" } ] },
      { no: 8, trans: "আর তারা তাদের কাছ থেকে কেবল এ কারণে বিদ্বেষ পোষণ করেছিল যে তারা আল্লাহর প্রতি ঈমান এনেছিল—পরাক্রমশালী, প্রশংসিত—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "আর না" }, { ar: "نَقَمُوا", pron: "নাক্বামু", root: "ن ق م", mean: "বিদ্বেষ পোষণ করেছিল" }, { ar: "مِنْهُم", pron: "মিনহুম", root: "م ن", mean: "তাদের থেকে" }, { ar: "إِلَّا", pron: "ইল্লা", root: "ا ل ل", mean: "ছাড়া" }, { ar: "أَن", pron: "আন", root: "ا ن", mean: "যে" }, { ar: "يُؤْمِنُوا", pron: "ইউ'মিনু", root: "ا م ن", mean: "তারা ঈমান এনেছিল" }, { ar: "بِاللَّهِ", pron: "বিল-লাহি", root: "ا ل ه", mean: "আল্লাহর প্রতি" }, { ar: "الْعَزِيزِ", pron: "আল-'আযিজি", root: "ع ز ز", mean: "পরাক্রমশালী" }, { ar: "الْحَمِيدِ", pron: "আল-হামিদি", root: "ح م د", mean: "প্রশংসিত" } ] },

      { no: 10, trans: "যারা মুমিন পুরুষ ও নারীদেরকে অত্যাচার করেছে, অতঃপর তওবা করেনি, তাদের জন্য রয়েছে জাহান্নামের শাস্তি ও দগ্ধ করার শাস্তি—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "فَتَنُوا", pron: "ফাতানু", root: "ف ت ن", mean: "অত্যাচার/পরীক্ষা করেছে" }, { ar: "الْمُؤْمِنِينَ", pron: "আল-মু'মিনিনা", root: "ا م ن", mean: "মুমিনদের" }, { ar: "وَالْمُؤْمِنَاتِ", pron: "ওয়াল-মু'মিনাতি", root: "ا م ن", mean: "এবং মুমিন নারীদের" }, { ar: "ثُمَّ", pron: "সুম্মা", root: "ث م م", mean: "অতঃপর" }, { ar: "لَمْ", pron: "লাম", root: "ل م", mean: "না" }, { ar: "يَتُوبُوا", pron: "ইয়াতুবু", root: "ت و ب", mean: "তওবা করেনি" }, { ar: "فَلَهُمْ", pron: "ফা-লাহুম", root: "ل ه", mean: "অতএব তাদের জন্য" }, { ar: "عَذَابُ", pron: "'আযাবু", root: "ع ذ ب", mean: "শাস্তি" }, { ar: "جَهَنَّمَ", pron: "জাহান্নামা", root: "ج ه ن م", mean: "জাহান্নামের" }, { ar: "وَلَهُمْ", pron: "ওয়া-লাহুম", root: "ل ه", mean: "এবং তাদের জন্য" }, { ar: "عَذَابُ", pron: "'আযাবু", root: "ع ذ ب", mean: "শাস্তি" }, { ar: "الْحَرِيقِ", pron: "আল-হারিকি", root: "ح ر ق", mean: "দগ্ধ করার" } ] },
      { no: 11, trans: "নিশ্চয় যারা ঈমান এনেছে ও সৎকর্ম করেছে, তাদের জন্য রয়েছে জান্নাত, যার নিচে নদী প্রবাহিত; এটাই মহাসাফল্য—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "آمَنُوا", pron: "আমানু", root: "ا م ن", mean: "ঈমান এনেছে" }, { ar: "وَعَمِلُوا", pron: "ওয়া-'আমিলু", root: "ع م ل", mean: "এবং করেছে" }, { ar: "الصَّالِحَاتِ", pron: "আস-সালিহাতি", root: "ص ل ح", mean: "সৎকর্ম" }, { ar: "لَهُمْ", pron: "লাহুম", root: "ل ه", mean: "তাদের জন্য" }, { ar: "جَنَّاتٌ", pron: "জান্নাতুন", root: "ج ن ن", mean: "জান্নাত" }, { ar: "تَجْرِي", pron: "তাজরি", root: "ج ر ي", mean: "প্রবাহিত" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "تَحْتِهَا", pron: "তাহতিহা", root: "ح ت ي", mean: "তার নিচে" }, { ar: "الْأَنْهَارُ", pron: "আল-আনহারু", root: "ن ه ر", mean: "নদীসমূহ" }, { ar: "ذَٰلِكَ", pron: "যালিকা", root: "ذ ل ك", mean: "এটাই" }, { ar: "الْفَوْزُ", pron: "আল-ফাওযু", root: "ف و ز", mean: "সাফল্য" }, { ar: "الْكَبِيرُ", pron: "আল-কাবিরু", root: "ك ب ر", mean: "মহান" } ] },
      { no: 12, trans: "নিশ্চয় তোমার রবের পাকড়াও অত্যন্ত কঠোর—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "بَطْشَ", pron: "বাতশা", root: "ب ط ش", mean: "পাকড়াও" }, { ar: "رَبِّكَ", pron: "রাব্বিকা", root: "ر ب ب", mean: "তোমার রবের" }, { ar: "لَشَدِيدٌ", pron: "লা-শাদিদুন", root: "ش د د", mean: "অবশ্যই কঠোর" } ] },
      { no: 13, trans: "নিশ্চয় তিনিই প্রথমবার সৃষ্টি করেন এবং পুনরায় সৃষ্টি করবেন—", words: [ { ar: "إِنَّهُ", pron: "ইন্নাহু", root: "ا ن", mean: "নিশ্চয় তিনি" }, { ar: "هُوَ", pron: "হুওয়া", root: "ه و", mean: "তিনিই" }, { ar: "يُبْدِئُ", pron: "ইউবদি-উ", root: "ب د ا", mean: "প্রথমবার সৃষ্টি করেন" }, { ar: "وَيُعِيدُ", pron: "ওয়া-ইউ'ইদু", root: "ع و د", mean: "এবং পুনরায় সৃষ্টি করবেন" } ] },
      { no: 14, trans: "আর তিনিই ক্ষমাশীল, প্রেমময়—", words: [ { ar: "وَهُوَ", pron: "ওয়া-হুওয়া", root: "ه و", mean: "আর তিনি" }, { ar: "الْغَفُورُ", pron: "আল-গাফুরু", root: "غ ف ر", mean: "ক্ষমাশীল" }, { ar: "الْوَدُودُ", pron: "আল-ওয়াদুদু", root: "و د د", mean: "প্রেমময়" } ] },

      { no: 17, trans: "তোমার কাছে কি বাহিনীসমূহের সংবাদ এসেছে?—", words: [ { ar: "هَلْ", pron: "হাল", root: "ه ل", mean: "কি" }, { ar: "أَتَاكَ", pron: "আতাকা", root: "ا ت ي", mean: "তোমার কাছে এসেছে" }, { ar: "حَدِيثُ", pron: "হাদিসু", root: "ح د ث", mean: "সংবাদ" }, { ar: "الْجُنُودِ", pron: "আল-জুনুদি", root: "ج ن د", mean: "বাহিনীসমূহের" } ] },
