const listEl=document.getElementById('list'), frame=document.getElementById('frame'), hiddenFrame=document.getElementById('hiddenFrame'), welcome=document.getElementById('welcome'), singleAyahDiv=document.getElementById('singleAyah'), topTitle=document.getElementById('topTitle'), topBadge=document.getElementById('topBadge'), search=document.getElementById('search'), ayahSearch=document.getElementById('ayahSearch'), ayahGo=document.getElementById('ayahGo'), homeBtn=document.getElementById('homeBtn'), showFullBtn=document.getElementById('showFullBtn');

let currentSurah=null;

function goHome(){
  document.querySelectorAll('.list li').forEach(el=>el.classList.remove('active'));

  currentSurah=null;
  welcome.style.display='block'; frame.style.display='none'; frame.src='about:blank'; singleAyahDiv.style.display='none'; showFullBtn.style.display='none';
  topTitle.textContent=' সূরা নির্বাচন করুন'; topBadge.textContent='১১৪ টি সূরা সম্পূর্ণ • আলহামদুলিল্লাহ';

`;
}
function render(filter=''){
  const term=filter.toLowerCase().trim(); listEl.innerHTML=''; let visible=0;
  surahNames.forEach((name,idx)=>{
    const no=idx+1, ar=surahArabic[idx], file=fileMap[no];
    const match=!term || no.toString().includes(term) || name.toLowerCase().includes(term) || ar.includes(term);
    if(!match) return; visible++;
    const li=document.createElement('li'); li.dataset.no=no;
    li.innerHTML=`<span class="no">${no}</span><span style="flex:1;font-weight:600">${name}</span><span class="ar">${ar}</span><span class="dot"></span>`;
    listEl.appendChild(li);
  }); document.getElementById('count').textContent=visible;
}
function showFullSurah(){
  if(!currentSurah) return;
  singleAyahDiv.style.display='none'; welcome.style.display='none'; frame.style.display='block'; showFullBtn.style.display='none';
  frame.src=fileMap[currentSurah];
  topBadge.textContent='পুরো সূরা: '+surahNames[currentSurah-1];
}
function extractSingleAyahFromDoc(doc, ayahNo){
  let el = doc.getElementById(`ayah-${ayahNo}`) || doc.getElementById(`verse-${ayahNo}`) || doc.querySelector(`[data-ayah="${ayahNo}"]`) || doc.querySelector(`[id="${ayahNo}"]`);
  if(el){ if(el.innerText.length<30 && el.parentElement) el=el.parentElement; return el; }
  const all = doc.body.querySelectorAll('div, p, li, tr, section, article');
  for(let node of all){
    if(node.children.length>8) continue;
    const txt = node.innerText ? node.innerText.trim() : '';
    if(!txt || txt.length>2500) continue;
    if(txt.startsWith(ayahNo+'.') || txt.startsWith(`(${ayahNo})`) || txt.includes(`আয়াত ${ayahNo}`) || txt.match(new RegExp(`^${ayahNo}\\s*[:।]`))){ return node; }
  }
  return null;
}
function showSingleAyah(surahNo, ayahNo){
  currentSurah=surahNo;
  document.querySelectorAll('.list li').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.list li[data-no="${surahNo}"]`)?.classList.add('active');
  const name=surahNames[surahNo-1], file=fileMap[surahNo];
  topTitle.textContent=`${surahNo}:${ayahNo} - ${name} (${surahArabic[surahNo-1]})`;
  welcome.style.display='none'; frame.style.display='none'; singleAyahDiv.style.display='block'; showFullBtn.style.display='inline-flex';
  singleAyahDiv.innerHTML=`<div style="text-align:center;padding:40px"><i class="fas fa-spinner fa-spin"></i> ${surahNo}:${ayahNo} লোড হচ্ছে...</div>`;
  topBadge.textContent=`লোড হচ্ছে ${surahNo}:${ayahNo}`;
  let settled=false;
  const loadTimeout = setTimeout(()=>{
    if(settled) return; settled=true;
    singleAyahDiv.innerHTML = `<div class="ayah-card"><div class="ayah-header"><span>${name} - আয়াত ${ayahNo}</span><span>${surahNo}:${ayahNo}</span></div><div class="ayah-body"><p>ফাইলটি লোড হতে অনেক সময় নিচ্ছে বা লোড হয়নি (<code>${file}</code>)। ফাইলটি এই index.html-এর একই ফোল্ডারে আছে কিনা এবং লোকাল সার্ভার (যেমন Live Server) দিয়ে খোলা হয়েছে কিনা যাচাই করুন — সরাসরি ফাইলে ডাবল-ক্লিক করে (file://) খুললে ব্রাউজার নিরাপত্তার কারণে এটি ব্লক হতে পারে।</p></div><div class="ayah-actions"><button class="btn btn-primary" onclick="showFullSurah()">পুরো সূরা</button></div></div>`;
  }, 6000);
  hiddenFrame.onload = function(){
    if(settled) return; settled=true; clearTimeout(loadTimeout);
    try{
      const doc = hiddenFrame.contentDocument || hiddenFrame.contentWindow.document;
      const ayahEl = extractSingleAyahFromDoc(doc, ayahNo);
      if(!ayahEl){
        singleAyahDiv.innerHTML = `<div class="ayah-card"><div class="ayah-header"><span>${name} - আয়াত ${ayahNo}</span><span>${surahNo}:${ayahNo}</span></div><div class="ayah-body"><p>আয়াতটি আলাদা করা যায়নি, পুরো সূরা খুলে দেখুন।</p></div><div class="ayah-actions"><button class="btn btn-primary" onclick="showFullSurah()">পুরো সূরা</button></div></div>`;
        return;
      }
      singleAyahDiv.innerHTML = `<div class="ayah-card"><div class="ayah-header"><div><b>${name}</b> • ${surahArabic[surahNo-1]} (${surahNo}:${ayahNo})</div><div style="font-size:12px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:20px">আয়াত ${ayahNo}</div></div><div class="ayah-body">${ayahEl.innerHTML}</div><div class="ayah-actions"><button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('.ayah-body').innerText)"><i class="fas fa-copy"></i> কপি</button><button class="btn" onclick="showSingleAyah(${surahNo}, ${ayahNo-1>0?ayahNo-1:1})"><i class="fas fa-chevron-left"></i> আগের</button><button class="btn" onclick="showSingleAyah(${surahNo}, ${ayahNo+1})">পরের <i class="fas fa-chevron-right"></i></button><button class="btn btn-primary" onclick="showFullSurah()"><i class="fas fa-book-open"></i> পুরো সূরা</button></div></div>`;
      topBadge.textContent=`✓ ${surahNo}:${ayahNo} - ${name}`;
    }catch(e){
      singleAyahDiv.innerHTML = `<div class="ayah-card"><div class="ayah-header"><span>${name} - আয়াত ${ayahNo}</span><span>${surahNo}:${ayahNo}</span></div><div class="ayah-body"><p><b>টেকনিক্যাল সমস্যা:</b> ${e.message}</p><p style="margin-top:10px;font-size:14px;color:#555">এটি সাধারণত ঘটে যদি আপনি এই ফাইলটি সরাসরি ডাবল-ক্লিক করে (file://) খুলে থাকেন — ব্রাউজার নিরাপত্তার কারণে একটি স্থানীয় ফাইলের ভেতরে অন্য স্থানীয় ফাইল স্ক্রিপ্ট দিয়ে পড়তে বাধা দেয়। সমাধান: এই ফোল্ডারটি একটি লোকাল সার্ভার (VSCode-এর Live Server extension, বা <code>python -m http.server</code>) দিয়ে চালান এবং <code>http://localhost...</code> ঠিকানা থেকে খুলুন।</p></div><div class="ayah-actions"><button class="btn btn-primary" onclick="showFullSurah()">পুরো সূরা</button></div></div>`;
    }
  };
  hiddenFrame.src = file + `?ayah=${ayahNo}&t=${Date.now()}`;
}
function showSurah(no){
  currentSurah=no;
  document.querySelectorAll('.list li').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.list li[data-no="${no}"]`)?.classList.add('active');
  const name=surahNames[no-1], file=fileMap[no]; topTitle.textContent=no+'. '+name+' - '+surahArabic[no-1];
  welcome.style.display='none'; singleAyahDiv.style.display='none'; frame.style.display='block'; showFullBtn.style.display='none';
  frame.src=file; topBadge.textContent='লোড হচ্ছে... '+name; frame.onload=()=>topBadge.textContent='✓ '+name+' ('+no+')';
}
function handleAyahSearch(){
  const raw = ayahSearch.value.trim(); if(!raw) return;
  const bnMap={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
  let normalized = raw.replace(/[০-৯]/g, d=>bnMap[d]).replace(/[ঃ॥]/g, ':');
  const match = normalized.match(/^(\d+)\s*[:ঃ\-।\s]\s*(\d+)$/);
  if(!match){ alert('ফরম্যাট: ৩:৭ বা ৩ঃ৭ বা 3:7'); return; }
  const s = parseInt(match[1]), a = parseInt(match[2]);
  if(s<1 || s>114){ alert('সূরা ১-১১৪'); return; }
  showSingleAyah(s, a);
}
listEl.addEventListener('click', e=>{ const li=e.target.closest('li'); if(li) showSurah(parseInt(li.dataset.no)); });
search.addEventListener('input', e=>render(e.target.value));
ayahGo.addEventListener('click', handleAyahSearch);
ayahSearch.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAyahSearch(); });
homeBtn.addEventListener('click', goHome);
showFullBtn.addEventListener('click', showFullSurah);
render();
</script>
</body>
