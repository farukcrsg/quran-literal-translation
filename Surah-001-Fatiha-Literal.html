                              <p className="text-[14px] font-extrabold tracking-widest text-emerald-800 uppercase">শব্দার্থ (রূট + ধাতব অর্থ)</p>
                            </div>
                            <div className="rounded-[16px] bg-[#fcfffe] border border-dashed border-emerald-200 p-3 md:p-4">
                              <div className="flex flex-wrap gap-2.5">
                                {ayah.words.map((w, wi) => (
                                  <div key={wi} className="inline-flex items-baseline gap-2 rounded-[14px] bg-[#f0fdf4] border border-emerald-200/70 px-3.5 py-2 shadow-[0_2px_0_#bbf7d0] hover:shadow-[0_4px_12px_-2px_rgba(21,128,61,0.15)] hover:-translate-y-[1px] transition-all">
                                    <span className="amiri text-[22px] font-bold text-emerald-800 leading-none">{w.ar}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[16px] font-semibold text-[#14532d]">{w.pron}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[15px] font-bold text-amber-700">{w.root}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[17px] font-extrabold text-emerald-900">{w.mean}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div className="mt-4">
                              <textarea
                                placeholder="Note:  আয়াত বা শব্দার্থ সম্পর্কে আপনার মন্তব্য লিখুন..."
                                className="w-full h-[80px] resize-none rounded-[14px] border-[2px] border-emerald-500/70 bg-[#f8fef9] px-4 py-3 text-[16px] font-bold leading-relaxed text-[#14532d] placeholder:text-emerald-800/40 placeholder:font-bold focus:outline-none focus:border-emerald-600 focus:ring-[3px] focus:ring-emerald-100 transition-all"
                                value={notes[idx] || ""}
                                onChange={(e) => handleNoteChange(idx, e.target.value)}
                              />
                              <div className={`save-indicator ${saved[idx] ? 'show' : ''}`}>
                                ✅ সংরক্ষিত হয়েছে
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* ডাউনলোড ও শেষাংশ */}
                    <div className="mt-10 rounded-[22px] bg-white border border-emerald-200 p-6 md:p-7 shadow-[0_10px_40px_-12px_rgba(21,128,61,0.2)]">
                      <div className="flex items-center justify-between flex-wrap gap-3 mb-6">
                        <div className="flex items-center gap-2">
                          <span className="h-8 w-8 rounded-full bg-emerald-600 text-white grid place-items-center text-[14px] font-bold">✓</span>
                          <span className="text-[16px] font-extrabold text-[#052e16]">ডাউনলোড করুন</span>
                        </div>
                        <div className="flex items-center gap-3">
                          {msg && <span className="text-[12px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full">{msg}</span>}
                          <button onClick={downloadHTML} className="inline-flex items-center gap-2 rounded-full bg-[#052e16] hover:bg-black text-white px-6 py-2.5 text-[15px] font-bold shadow-[0_8px_20px_-8px_rgba(0,0,0,0.5)] transition-all active:scale-[0.98]">
                            <span className="text-[16px]">📥</span> ডাউনলোড
                          </button>
                        </div>
                      </div>
                      <div className="rounded-[16px] bg-gradient-to-r from-emerald-700 via-emerald-600 to-[#052e16] p-[1.5px] shadow-[0_10px_30px_-10px_rgba(21,128,61,0.6)]">
                        <div className="rounded-[14px] bg-gradient-to-r from-emerald-700 to-[#052e16] px-6 py-5 text-center">
                          <p className="text-[21px] md:text-[22px] font-extrabold leading-relaxed text-white tracking-wide">আলহামদুলিল্লাহ – সূরা ফাতিহা অনুবাদ সমাপ্ত</p> 
                          <div className="mt-2 flex justify-center"><div className="h-1 w-12 rounded-full bg-white/40"></div></div>
                        </div>
                      </div>
                    </div>
                    <div className="mt-8 text-center text-[12px] font-bold tracking-widest text-emerald-800/50 uppercase">@সূরা Fatiha (001) – ধাতব অর্থ (লিসানুল আরব) • রূট + ধাতব অর্থ • লিসানুল আরব</div>
                  </div>
                </div>
              );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(
              React.createElement(React.StrictMode, null, React.createElement(App))
            );
          </script>
        </body>
        </html>
