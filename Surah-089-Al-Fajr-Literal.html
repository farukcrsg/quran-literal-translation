      { no: 5, trans: "এতে কি বুদ্ধিমানদের জন্য পর্যাপ্ত শপথ আছে?—", words: [ { ar: "هَلْ", pron: "হাল", root: "ه ل", mean: "কি" }, { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "ذَٰلِكَ", pron: "যালিকা", root: "ذ ل ك", mean: "এতে" }, { ar: "قَسَمٌ", pron: "কাসামুন", root: "ق س م", mean: "শপথ" }, { ar: "لِّذِي", pron: "লি-যি", root: "ذ و", mean: "মালিক/যুক্ত" }, { ar: "حِجْرٍ", pron: "হিজরিন", root: "ح ج ر", mean: "বুদ্ধিমান" } ] },
