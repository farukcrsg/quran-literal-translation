                    <div className="mt-6 rounded-[16px] bg-white border border-emerald-200 shadow-[0_6px_20px_-8px_rgba(21,128,61,0.15)] px-6 py-4 text-center">
                      <p className="text-[20px] md:text-[22px] font-bold text-[#052e16] leading-relaxed"> ‘‘হে আমার রব, আমি শয়তানদের প্ররোচনা থেকে তোমার কাছে আশ্রয় চাই।

        এবং হে আমার রব, আমি তোমার কাছে আশ্রয় চাই—যাতে তারা আমার কাছে উপস্থিত না হয়।’’</p>
                    </div>
                    {/* আয়াতসমূহ */}
                    <div className="mt-8 space-y-6">
                      {ayahData.map((ayah, idx) => (
                        <div key={idx} className="group relative rounded-[22px] bg-white border border-[#bbf7d0] shadow-[0_10px_30px_-10px_rgba(21,128,61,0.15)] overflow-hidden">
                          <div className="h-[4px] w-full bg-gradient-to-r from-emerald-600 to-emerald-300"></div>
                          <div className="p-6 md:p-7">
                            <div className="flex items-center gap-3 mb-4">
                              <div className="flex h-9 w-9 items-center justify-center rounded-full bg-[#052e16] text-white text-[16px] font-extrabold shadow">{ayah.no}</div>
                              <span className="text-[13px] font-bold tracking-[0.15em] text-emerald-700 uppercase">আয়াত {ayah.no}</span>
                              <div className="ml-auto h-px flex-1 bg-gradient-to-r from-emerald-100 to-transparent"></div>
                            </div>
                            <div className="rounded-[16px] bg-gradient-to-br from-emerald-50 to-[#f0fdf4] border border-emerald-100 p-5 md:p-6 mb-5">
                              <p className="text-[21px] md:text-[22px] font-bold leading-[1.8] text-[#14532d] tracking-[-0.01em]">{ayah.trans}</p>
                            </div>
                            <div className="flex items-center gap-2 mb-3">
                              <div className="h-5 w-1 rounded-full bg-emerald-600"></div>
                              <p className="text-[14px] font-extrabold tracking-widest text-emerald-800 uppercase">শব্দার্থ (রূট + ধাতব অর্থ)</p>
                            </div>
                            <div className="rounded-[16px] bg-[#fcfffe] border border-dashed border-emerald-200 p-3 md:p-4">
                              <div className="flex flex-wrap gap-2.5">
                                {ayah.words.map((w, wi) => (
                                  <div key={wi} className="inline-flex items-baseline gap-2 rounded-[14px] bg-[#f0fdf4] border border-emerald-200/70 px-3.5 py-2 shadow-[0_2px_0_#bbf7d0] hover:shadow-[0_4px_12px_-2px_rgba(21,128,61,0.15)] hover:-translate-y-[1px] transition-all">
                                    <span className="amiri text-[22px] font-bold text-emerald-800 leading-none">{w.ar}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[16px] font-semibold text-[#14532d]">{w.pron}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[15px] font-bold text-amber-700">{w.root}</span>
                                    <span className="text-[15px] font-medium text-[#4d7c5a]">–</span>
                                    <span className="text-[17px] font-extrabold text-emerald-900">{w.mean}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div className="mt-4">
                              <textarea
                                placeholder="Note:  আয়াত বা শব্দার্থ সম্পর্কে আপনার মন্তব্য লিখুন..."
                                className="w-full h-[80px] resize-none rounded-[14px] border-[2px] border-emerald-500/70 bg-[#f8fef9] px-4 py-3 text-[16px] font-bold leading-relaxed text-[#14532d] placeholder:text-emerald-800/40 placeholder:font-bold focus:outline-none focus:border-emerald-600 focus:ring-[3px] focus:ring-emerald-100 transition-all"
                                value={notes[idx] || ""}
                                onChange={(e) => handleNoteChange(idx, e.target.value)}
                              />
                              <div className={`save-indicator ${saved[idx] ? 'show' : ''}`}>
                                ✅ সংরক্ষিত হয়েছে
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* শেষাংশ - সূরার নাম বাংলায় */}
                    <div className="mt-10 rounded-[16px] bg-gradient-to-r from-emerald-700 via-emerald-600 to-[#052e16] p-[1.5px] shadow-[0_10px_30px_-10px_rgba(21,128,61,0.6)]">
                      <div className="rounded-[14px] bg-gradient-to-r from-emerald-700 to-[#052e16] px-6 py-5 text-center">
                        <p className="text-[21px] md:text-[22px] font-extrabold leading-relaxed text-white tracking-wide">আলহামদুলিল্লাহ – সূরা Al অনুবাদ সমাপ্ত</p>
                        <div className="mt-2 flex justify-center"><div className="h-1 w-12 rounded-full bg-white/40"></div></div>
                      </div>
                    </div>
                    <div className="mt-8 text-center text-[12px] font-bold tracking-widest text-emerald-800/50 uppercase">@সূরা Al (096) – ধাতব অর্থ (লিসানুল আরব) • রূট + ধাতব অর্থ • লিসানুল আরব</div>
                  </div>
                </div>
              );
            }

            ReactDOM.createRoot(document.getElementById('root')).render(
              React.createElement(React.StrictMode, null, React.createElement(App))
            );
          </script>
