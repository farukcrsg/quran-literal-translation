      { no: 1, trans: "যারা কুফুরি করে, আহলে কিতাব ও মুশরিকরা, তারা বিরত ছিল না যতক্ষণ না তাদের কাছে স্পষ্ট প্রমাণ আসে—", words: [ { ar: "لَمْ", pron: "লাম", root: "ل م", mean: "না" }, { ar: "يَكُنِ", pron: "ইয়াকুনি", root: "ك و ن", mean: "ছিল" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "كَفَرُوا", pron: "কাফারু", root: "ك ف ر", mean: "কুফুরি/অস্বীকার করেছে" }, { ar: "مِنْ", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "أَهْلِ", pron: "আহলি", root: "ا ه ل", mean: "অধিকারী/গোত্র" }, { ar: "الْكِتَابِ", pron: "আল-কিতাবি", root: "ك ت ب", mean: "কিতাব/লেখা" }, { ar: "وَالْمُشْرِكِينَ", pron: "ওয়াল-মুশরিকিনা", root: "ش ر ك", mean: "এবং মুশরিক/অংশীদার স্থাপনকারীরা" }, { ar: "مُنفَكِّينَ", pron: "মুনফাক্কিনা", root: "ف ك ك", mean: "বিরত/মুক্ত" }, { ar: "حَتَّى", pron: "হাত্তা", root: "ح ت ي", mean: "পর্যন্ত" }, { ar: "تَأْتِيَهُمُ", pron: "তা'তিয়াহুমু", root: "ا ت ي", mean: "আসে" }, { ar: "الْبَيِّنَةُ", pron: "আল-বাইয়্যিনাতু", root: "ب ي ن", mean: "স্পষ্ট প্রমাণ/নিদর্শন" } ] },

      { no: 4, trans: "আর যাদেরকে কিতাব দেওয়া হয়েছে তারা বিভক্ত হয়নি কিন্তু তাদের কাছে স্পষ্ট প্রমাণ আসার পর—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "এবং না" }, { ar: "تَفَرَّقَ", pron: "তাফাররাকা", root: "ف ر ق", mean: "বিভক্ত হয়েছে" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "أُوتُوا", pron: "উতু", root: "ا ت ي", mean: "দেওয়া হয়েছে" }, { ar: "الْكِتَابَ", pron: "আল-কিতাবা", root: "ك ت ب", mean: "কিতাব" }, { ar: "إِلَّا", pron: "ইল্লা", root: "ا ل ل", mean: "ছাড়া" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "بَعْدِ", pron: "বা'দি", root: "ب ع د", mean: "পর" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "যা" }, { ar: "جَاءَتْهُمُ", pron: "জা-আতহুমু", root: "ج ي ا", mean: "আসে" }, { ar: "الْبَيِّنَةُ", pron: "আল-বাইয়্যিনাতু", root: "ب ي ن", mean: "স্পষ্ট প্রমাণ" } ] },
      { no: 5, trans: "আর তাদেরকে আদেশ দেওয়া হয়েছিলো কেবল এটাই যে তারা আল্লাহর ইবাদত করবে, তাঁর প্রতি একনিষ্ঠ হয়ে, একত্ববাদী হয়ে, সালাত কায়েম করবে ও যাকাত দেবে; আর এটাই হলো সঠিক দ্বীন—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "এবং না" }, { ar: "أُمِرُوا", pron: "উমিরু", root: "ا م ر", mean: "আদেশ দেওয়া হয়েছিলো" }, { ar: "إِلَّا", pron: "ইল্লা", root: "ا ل ل", mean: "ছাড়া" }, { ar: "لِيَعْبُدُوا", pron: "লি-ইয়া'বুদু", root: "ع ب د", mean: "যাতে তারা ইবাদত/দাসত্ব করে" }, { ar: "اللَّهَ", pron: "আল্লাহা", root: "ا ل ه", mean: "আল্লাহকে" }, { ar: "مُخْلِصِينَ", pron: "মুখলিসিনা", root: "خ ل ص", mean: "একনিষ্ঠ/শুদ্ধ" }, { ar: "لَهُ", pron: "লাহু", root: "ل ه", mean: "তার জন্য" }, { ar: "الدِّينَ", pron: "আদ-দিনা", root: "د ي ن", mean: "ধর্ম/আনুগত্য" }, { ar: "حُنَفَاءَ", pron: "হুনাফা-আ", root: "ح ن ف", mean: "একত্ববাদী/সরল" }, { ar: "وَيُقِيمُوا", pron: "ওয়া-ইউক্বিমু", root: "ق و م", mean: "এবং কায়েম করবে" }, { ar: "الصَّلَاةَ", pron: "আস-সালাতা", root: "ص ل و", mean: "যোগাযোগ/সংযোগ (সালাত)" }, { ar: "وَيُؤْتُوا", pron: "ওয়া-ইউ'তু", root: "ا ت ي", mean: "এবং দেবে" }, { ar: "الزَّكَاةَ", pron: "আয-যাকাতা", root: "ز ك و", mean: "পবিত্রতা/বৃদ্ধি (যাকাত)" }, { ar: "وَذَلِكَ", pron: "ওয়া-যালিকা", root: "ذ ل ك", mean: "এবং এটাই" }, { ar: "دِينُ", pron: "দিনু", root: "د ي ن", mean: "ধর্ম/আনুগত্য" }, { ar: "الْقَيِّمَةِ", pron: "আল-কাইয়্যিমাতি", root: "ق و م", mean: "সঠিক/প্রতিষ্ঠিত" } ] },
      { no: 6, trans: "নিশ্চয় যারা কুফুরি করেছে, আহলে কিতাব ও মুশরিকরা, তারা জাহান্নামের আগুনে থাকবে, সেখানে তারা স্থায়ী হবে—তারাই হলো সৃষ্টির সর্বশ্রেষ্ঠ—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "كَفَرُوا", pron: "কাফারু", root: "ك ف ر", mean: "কুফুরি/অস্বীকার করেছে" }, { ar: "مِنْ", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "أَهْلِ", pron: "আহলি", root: "ا ه ل", mean: "অধিকারী" }, { ar: "الْكِتَابِ", pron: "আল-কিতাবি", root: "ك ت ب", mean: "কিতাবের" }, { ar: "وَالْمُشْرِكِينَ", pron: "ওয়াল-মুশরিকিনা", root: "ش ر ك", mean: "এবং মুশরিকরা" }, { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "نَارِ", pron: "নারি", root: "ن و ر", mean: "আগুনের" }, { ar: "جَهَنَّمَ", pron: "জাহান্নামা", root: "ج ه ن م", mean: "জাহান্নাম" }, { ar: "خَالِدِينَ", pron: "খালিদিনা", root: "خ ل د", mean: "স্থায়ী" }, { ar: "فِيهَا", pron: "ফিহা", root: "ف ي", mean: "সেখানে" }, { ar: "أُولَئِكَ", pron: "উলা-ইকা", root: "ا و ل", mean: "তারাই" }, { ar: "هُمْ", pron: "হুম", root: "ه م", mean: "তারা" }, { ar: "شَرُّ", pron: "শাররু", root: "ش ر ر", mean: "সর্বশ্রেষ্ঠ" }, { ar: "الْبَرِيَّةِ", pron: "আল-বারিয়্যাতি", root: "ب ر ا", mean: "সৃষ্টির" } ] },
      { no: 7, trans: "নিশ্চয় যারা ঈমান এনেছে ও সৎকর্ম করেছে—তারাই হলো সৃষ্টির সর্বোত্তম—", words: [ { ar: "إِنَّ", pron: "ইন্না", root: "ا ن", mean: "নিশ্চয়" }, { ar: "الَّذِينَ", pron: "আল্লাযিনা", root: "ا ل ل ذ", mean: "যারা" }, { ar: "آمَنُوا", pron: "আমানু", root: "ا م ن", mean: "ঈমান এনেছে" }, { ar: "وَعَمِلُوا", pron: "ওয়া-'আমিলু", root: "ع م ل", mean: "এবং করেছে" }, { ar: "الصَّالِحَاتِ", pron: "আস-সালিহাতি", root: "ص ل ح", mean: "সৎকর্ম" }, { ar: "أُولَئِكَ", pron: "উলা-ইকা", root: "ا و ل", mean: "তারাই" }, { ar: "هُمْ", pron: "হুম", root: "ه م", mean: "তারা" }, { ar: "خَيْرُ", pron: "খাইরু", root: "خ ي ر", mean: "সর্বোত্তম" }, { ar: "الْبَرِيَّةِ", pron: "আল-বারিয়্যাতি", root: "ب ر ا", mean: "সৃষ্টির" } ] },
      { no: 8, trans: "তাদের পুরস্কার তাদের রবের কাছে রয়েছে স্থায়ী জান্নাত, যার নিচে নদী প্রবাহিত; সেখানে তারা চিরকাল থাকবে। আল্লাহ তাদের প্রতি সন্তুষ্ট এবং তারাও তাঁর প্রতি সন্তুষ্ট—এটা তার জন্য যে তার রবকে ভয় করে।—", words: [ { ar: "جَزَاؤُهُمْ", pron: "জাযা-উহুম", root: "ج ز ي", mean: "তাদের পুরস্কার" }, { ar: "عِندَ", pron: "'ইন্দা", root: "ع ن د", mean: "কাছে" }, { ar: "رَبِّهِم", pron: "রাব্বিহিম", root: "ر ب ب", mean: "তাদের রবের" }, { ar: "جَنَّاتُ", pron: "জান্নাতু", root: "ج ن ن", mean: "বাগান/উদ্যান" }, { ar: "عَدْنٍ", pron: "'আদিন", root: "ع د ن", mean: "স্থায়ী/আবাস" }, { ar: "تَجْرِي", pron: "তাজরি", root: "ج ر ي", mean: "প্রবাহিত" }, { ar: "مِن", pron: "মিন", root: "م ن", mean: "হতে" }, { ar: "تَحْتِهَا", pron: "তাহতিহা", root: "ح ت ي", mean: "তার নিচে" }, { ar: "الْأَنْهَارُ", pron: "আল-আনহারু", root: "ن ه ر", mean: "নদীসমূহ" }, { ar: "خَالِدِينَ", pron: "খালিদিনা", root: "خ ل د", mean: "স্থায়ী" }, { ar: "فِيهَا", pron: "ফিহা", root: "ف ي", mean: "সেখানে" }, { ar: "أَبَدًا", pron: "আবাদান", root: "ا ب د", mean: "চিরকাল" }, { ar: "رَضِيَ", pron: "রাদিয়া", root: "ر ض ي", mean: "সন্তুষ্ট হয়েছেন" }, { ar: "اللَّهُ", pron: "আল্লাহু", root: "ا ل ه", mean: "আল্লাহ" }, { ar: "عَنْهُمْ", pron: "'আনহুম", root: "ع ن", mean: "তাদের থেকে" }, { ar: "وَرَضُوا", pron: "ওয়া-রাদু", root: "ر ض ي", mean: "এবং সন্তুষ্ট হয়েছেন" }, { ar: "عَنْهُ", pron: "'আনহু", root: "ع ن", mean: "তা থেকে" }, { ar: "ذَلِكَ", pron: "যালিকা", root: "ذ ل ك", mean: "এটা" }, { ar: "لِمَنْ", pron: "লি-মান", root: "ل م ن", mean: "তার জন্য" }, { ar: "خَشِيَ", pron: "খাশিয়া", root: "خ ش ي", mean: "ভয়/সতর্ক হয়েছে" }, { ar: "رَبَّهُ", pron: "রাব্বাহু", root: "ر ب ب", mean: "তার রবকে" } ] }
    ];

            function App() {
              const [msg, setMsg] = useState("");
              const [notes, setNotes] = useState({});
              const [saved, setSaved] = useState({});

              useEffect(() => {
                const savedNotes = {};
                ayahData.forEach((ayah, idx) => {
                  const key = STORAGE_PREFIX + idx;
                  const val = localStorage.getItem(key);
                  if (val) savedNotes[idx] = val;
                });
                setNotes(savedNotes);
              }, []);

              const handleNoteChange = (idx, value) => {
                const key = STORAGE_PREFIX + idx;
                localStorage.setItem(key, value);
                setNotes(prev => ({ ...prev, [idx]: value }));
                setSaved(prev => ({ ...prev, [idx]: true }));
                setTimeout(() => setSaved(prev => ({ ...prev, [idx]: false })), 2000);
              };

              return (
