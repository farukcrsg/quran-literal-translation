      { no: 3, trans: "আর শপথ পিতা ও যা তিনি জন্ম দেন—", words: [ { ar: "وَوَالِدٍ", pron: "ওয়া-ওয়ালিদিন", root: "و ل د", mean: "এবং পিতা/জনক" }, { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "এবং যা" }, { ar: "وَلَدَ", pron: "ওয়ালাদা", root: "و ل د", mean: "জন্ম দিয়েছে/উৎপন্ন করেছে" } ] },
      { no: 4, trans: "নিশ্চয় আমরা মানুষকে কষ্টের মধ্যে সৃষ্টি করেছি—", words: [ { ar: "لَقَدْ", pron: "লা-ক্বদ", root: "ل ق د", mean: "নিশ্চয়" }, { ar: "خَلَقْنَا", pron: "খালাক্বনা", root: "خ ل ق", mean: "সৃষ্টি করেছি" }, { ar: "الْإِنسَانَ", pron: "আল-ইনসানা", root: "ا ن س", mean: "মানুষকে" }, { ar: "فِي", pron: "ফি", root: "ف ي", mean: "মধ্যে" }, { ar: "كَبَدٍ", pron: "কাবাদিন", root: "ك ب د", mean: "কষ্ট/শ্রম" } ] },

      { no: 7, trans: "কি সে মনে করে যে তাকে কেউ দেখেনি?—", words: [ { ar: "أَيَحْسَبُ", pron: "আ-ইয়াহছাবু", root: "ح س ب", mean: "কি সে মনে করে" }, { ar: "أَن", pron: "আন", root: "ا ن", mean: "যে" }, { ar: "لَّمْ", pron: "লাম", root: "ل م", mean: "না" }, { ar: "يَرَهُ", pron: "ইয়ারাহু", root: "ر ا ي", mean: "তাকে দেখে" }, { ar: "أَحَدٌ", pron: "আহাদুন", root: "ا ح د", mean: "কেউ" } ] },
      { no: 8, trans: "আমরা কি তাকে দুটি চোখ দিইনি?—", words: [ { ar: "أَلَمْ", pron: "আ-লাম", root: "ا ل م", mean: "কি আমরা না" }, { ar: "نَجْعَل", pron: "নাজ'আল", root: "ج ع ل", mean: "তৈরি করি/দিই" }, { ar: "لَّهُ", pron: "লাহু", root: "ل ه", mean: "তার জন্য" }, { ar: "عَيْنَيْنِ", pron: "আইনাইনি", root: "ع ي ن", mean: "দুটি চোখ" } ] },

      { no: 12, trans: "আর তুমি কি জানো ঘাটি কী?—", words: [ { ar: "وَمَا", pron: "ওয়া-মা", root: "م ا", mean: "এবং কি" }, { ar: "أَدْرَاكَ", pron: "আদরাকা", root: "د ر ك", mean: "তোমাকে জানাল/বোঝাল" }, { ar: "مَا", pron: "মা", root: "م ا", mean: "কি" }, { ar: "الْعَقَبَةُ", pron: "আল-আক্বাবাতু", root: "ع ق ب", mean: "ঘাটি" } ] },

      { no: 15, trans: "নিকটাত্মীয় অনাথকে—", words: [ { ar: "يَتِيمًا", pron: "ইয়াতিমান", root: "ي ت م", mean: "অনাথ" }, { ar: "ذَا", pron: "যা", root: "ذ و", mean: "মালিক/যুক্ত" }, { ar: "مَقْرَبَةٍ", pron: "মাক্বরাবাতিন", root: "ق ر ب", mean: "নিকটাত্মীয়তা" } ] },
      { no: 16, trans: "অথবা মাটিতে লুটানো মিসকিনকে—", words: [ { ar: "أَوْ", pron: "আও", root: "ا و", mean: "অথবা" }, { ar: "مِسْكِينًا", pron: "মিসকিনান", root: "س ك ن", mean: "মিসকিন/অভাবগ্রস্ত" }, { ar: "ذَا", pron: "যা", root: "ذ و", mean: "মালিক/যুক্ত" }, { ar: "مَتْرَبَةٍ", pron: "মাত্রাবাতিন", root: "ت ر ب", mean: "মাটি/ধূলি" } ] },
